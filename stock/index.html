<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stock Plomberie</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stock">
<meta name="theme-color" content="#0F2036">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Une colonne, lignes compactes, une grosse action par ligne ; le reste dans une feuille du bas */
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{--bg:#EEF1F4;--card:#fff;--ink:#101826;--mut:#5E6978;--line:#DCE1E7;--soft:#F3F5F8;--sel:#0F2036;--selfg:#fff;--acc:#1F6FD1;--bad:#C0261D;--badbg:#FCE6E4;--ok:#0B6B4D;--disp:"Barlow Condensed",Barlow,system-ui,sans-serif;--body:Barlow,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B121C;--card:#142030;--ink:#EEF2F7;--mut:#94A1B3;--line:#25364B;--soft:#1A2838;--sel:#F5B700;--selfg:#101826;--acc:#6FA8F0;--bad:#FF8A80;--badbg:#3D1614;--ok:#59D3A4;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B121C;--card:#142030;--ink:#EEF2F7;--mut:#94A1B3;--line:#25364B;--soft:#1A2838;--sel:#F5B700;--selfg:#101826;--acc:#6FA8F0;--bad:#FF8A80;--badbg:#3D1614;--ok:#59D3A4;color-scheme:dark}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 var(--body)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
main{max-width:600px;margin:0 auto;padding-block:8px calc(96px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:center;gap:8px;margin:4px 0 10px}
h1{margin:0;flex:1;font:700 36px/1 var(--disp);text-wrap:balance}
.ic{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:22px;font-weight:700;display:grid;place-items:center;padding:0}
.alert{display:block;width:100%;text-align:left;border:0;border-radius:12px;background:var(--badbg);color:var(--bad);font-weight:700;padding:11px 14px;margin-bottom:10px}
.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:10px}
.seg button{border:0;background:none;color:var(--mut);font-weight:700;padding:10px 4px;border-radius:9px}
.seg .on{background:var(--sel);color:var(--selfg)}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.grp{font:700 15px/1 var(--disp);text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:16px 4px 6px}
.row{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 0;border-top:1px solid var(--line);min-height:62px}
.list .row:first-child{border-top:0}
.row .main{flex:1;min-width:0;border:0;background:none;text-align:left;padding:4px 0 4px 14px}
.row.low .main{box-shadow:inset 4px 0 0 var(--bad)}
.nm{display:block;font-weight:600;line-height:1.25}
.meta{display:block;color:var(--mut);font-size:14px;font-variant-numeric:tabular-nums}
.meta .lo{color:var(--bad);font-weight:700}
.big{flex:none;min-width:64px;height:48px;border-radius:12px;border:0;background:var(--sel);color:var(--selfg);font:700 22px/1 var(--disp);padding:0 12px;display:grid;place-items:center;text-decoration:none}
.big.alt{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.big.acc{background:var(--acc);color:#fff;font-size:18px}
.num{flex:none;min-width:52px;text-align:right;font:700 30px/1 var(--disp);font-variant-numeric:tabular-nums;padding-right:4px}
.num.lo{color:var(--bad)}
.empty{text-align:center;color:var(--mut);padding:28px 12px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav button{border:0;background:none;color:var(--mut);font-weight:700;font-size:12px;padding:6px 2px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav svg{width:26px;height:26px}
nav .on{color:var(--ink);background:var(--soft)}
.dot{position:absolute;top:2px;left:calc(50% + 6px);background:var(--bad);color:#fff;font-size:11px;min-width:18px;height:18px;line-height:18px;border-radius:9px;padding:0 4px;font-style:normal}
dialog{border:0;padding:0;margin:auto auto 0;width:100%;max-width:600px;max-height:88vh;border-radius:18px 18px 0 0;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.sh{padding:18px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px}
.sh h2{margin:0;font:700 28px/1.05 var(--disp);text-wrap:balance}
.sub{margin:0;color:var(--mut);font-size:15px}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.nums div{background:var(--soft);border-radius:10px;padding:8px 10px}
.nums small{display:block;color:var(--mut);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.nums b{font:700 28px/1 var(--disp)}
.nums b.lo{color:var(--bad)}
.acts{display:flex;flex-direction:column;gap:8px}
.act{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:13px 14px;font-weight:600;text-decoration:none;color:var(--ink)}
.act.pri{background:var(--sel);color:var(--selfg);border-color:var(--sel);text-align:center}
.act.acc{background:var(--acc);color:#fff;border-color:var(--acc);text-align:center}
.act.danger{color:var(--bad)}
.act.ghost{border:0;background:none;text-align:center;color:var(--mut)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.step{display:grid;grid-template-columns:64px 1fr 64px;gap:8px}
.step button{height:60px;border-radius:12px;border:1px solid var(--line);background:var(--soft);font:700 30px/1 var(--disp)}
.step input{height:60px;text-align:center;font:700 34px/1 var(--disp);border:1px solid var(--line);border-radius:12px;background:var(--bg);min-width:0}
label{font-size:14px;font-weight:600;color:var(--mut);display:block;margin-bottom:4px}
.fld input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
textarea{width:100%;height:200px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:13px/1.4 ui-monospace,Menlo,monospace}
.log{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.log span{color:var(--mut);font-size:13px;flex:none}
.loglist{max-height:55vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:10;display:flex;align-items:center;gap:12px;background:var(--sel);color:var(--selfg);padding:10px 12px 10px 16px;border-radius:12px;font-weight:600;max-width:calc(100vw - 32px);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1;pointer-events:auto}
.toast button{border:0;background:none;color:inherit;font-weight:700;text-decoration:underline;padding:4px}
.toast button[hidden]{display:none}
/* ---- Devis ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
.card h3{margin:0;font:700 20px/1.15 var(--disp);flex:1;min-width:0}
.hrow{display:flex;align-items:flex-start;gap:8px}
.x{flex:none;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--soft);font-size:18px;padding:0}
.card .fld input,.card textarea.ta{width:100%}
textarea.ta{height:auto;min-height:64px;font:inherit;font-size:16px;padding:10px 12px}
.seg.sm{margin:0}.seg.sm button{padding:8px 4px;font-size:15px}
.hstep{display:grid;grid-template-columns:48px 1fr 48px;gap:8px;align-items:center}
.hstep button{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--soft);font:700 24px/1 var(--disp)}
.hstep b{text-align:center;font:700 26px/1 var(--disp)}
.calc{color:var(--mut);font-size:15px;font-variant-numeric:tabular-nums}
.pc{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.pc .nm{flex:1;min-width:0;font-weight:500;font-size:15px}
.pc .meta{font-size:13px}
.qs{display:flex;align-items:center;gap:4px;flex:none}
.qs button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--soft);font-weight:700;padding:0}
.qs b{min-width:22px;text-align:center;font-variant-numeric:tabular-nums}
.link{border:0;background:none;color:var(--acc);font-weight:700;padding:6px 0;text-align:left}
.st{display:flex;justify-content:space-between;font-weight:700;font-variant-numeric:tabular-nums}
.tot{display:grid;gap:4px;font-variant-numeric:tabular-nums}
.tot div{display:flex;justify-content:space-between}
.tot .ttc{font:700 30px/1.1 var(--disp);border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.chk{display:flex;align-items:center;gap:10px;font-weight:600}
.chk input{width:24px;height:24px;accent-color:var(--sel)}
.back{border:0;background:none;color:var(--acc);font-weight:700;padding:4px 0;margin-bottom:6px}
.chip{flex:none;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--soft);color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.chip.ok{color:var(--ok)}
.cats{display:flex;flex-wrap:wrap;gap:6px}.cats button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 12px;font-weight:600}.cats .on{background:var(--sel);color:var(--selfg);border-color:var(--sel)}
/* Document du devis : volontairement papier blanc dans les deux thèmes */
:root{--paper:#FFFFFF;--pink:#14181F;--pmut:#5B6470;--pline:#D6DBE1;--phead:#0F2036}
#doc{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch}
.docbar{position:sticky;top:0;z-index:1;display:flex;gap:8px;align-items:center;background:var(--card);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px))}
.docbar .sp{flex:1}
.docbar .act{width:auto;padding:9px 14px}
.paper{background:var(--paper);color:var(--pink);max-width:820px;margin:12px auto 40px;padding:28px 26px;font:13px/1.45 var(--body);box-shadow:0 1px 6px rgba(0,0,0,.15)}
.paper h1{font:700 30px/1 var(--disp);color:var(--phead);margin:0}
.ph{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--phead);padding-bottom:14px;margin-bottom:16px}
.ph .co b{font-size:17px;color:var(--phead)}
.ph .co,.ph .meta2{white-space:pre-line}
.ph .meta2{text-align:right}
.cli{margin:0 0 16px auto;max-width:300px;border:1px solid var(--pline);padding:10px 12px;white-space:pre-line}
.cli small{display:block;color:var(--pmut);text-transform:uppercase;font-size:10px;letter-spacing:.06em;font-weight:700}
.tw{overflow-x:auto}
.paper table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.paper th{background:var(--phead);color:#fff;text-align:left;padding:6px 8px;font-size:12px}
.paper td{padding:6px 8px;border-bottom:1px solid var(--pline);vertical-align:top}
.paper td.r,.paper th.r{text-align:right;white-space:nowrap}
.paper tr.ti td{font-weight:700;background:#F1F4F7;border-bottom:0}
.paper .ds{color:var(--pmut);font-size:12px;font-weight:400;display:block}
.paper .inc{color:var(--pmut);font-style:italic}
.ptot{margin:14px 0 0 auto;max-width:300px;font-variant-numeric:tabular-nums}
.ptot div{display:flex;justify-content:space-between;padding:4px 0}
.ptot .g{font-weight:700;font-size:17px;border-top:2px solid var(--phead);padding-top:8px;color:var(--phead)}
.ment{margin-top:18px;color:var(--pmut);font-size:11px;white-space:pre-line}
.sign{margin-top:18px;display:flex;gap:16px;flex-wrap:wrap}
.sign div{flex:1;min-width:220px;border:1px solid var(--pline);height:110px;padding:8px;font-size:12px;color:var(--pmut)}
@media print{
  body{background:#fff}
  main,nav,.toast,.docbar,dialog{display:none!important}
  #doc{position:static;overflow:visible;background:#fff}
  .paper{box-shadow:none;margin:0;max-width:none;padding:0}
  @page{margin:14mm}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

</head>
<body>
<main>
  <header><h1 id="title">Camion</h1><button class="ic" id="addBtn" aria-label="Ajouter une pièce" hidden>+</button><button class="ic" id="menuBtn" aria-label="Menu">⋯</button></header>
  <button class="alert" id="alert" hidden></button>
  <div id="view"></div>
</main>

<nav id="nav">
  <button data-v="camion"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 6h13v10H1zM14 10h4l4 4v2h-8z"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg>Camion</button>
  <button data-v="boutique"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l1-5h16l1 5M3 9h18v11H3zM9 20v-6h6v6"/></svg>Boutique<i class="dot" id="dot" hidden></i></button>
  <button data-v="devis"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6M9 13h8M9 17h6"/></svg>Devis</button>
  <button data-v="factures"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 2h14v20l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M15 8.5a3 3 0 1 0 0 5M8 10h5M8 12.5h5"/></svg>Factures</button>
  <button data-v="clients"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>Clients</button>
</nav>

<dialog id="dlg"><div class="sh" id="sh"></div></dialog>
<div id="doc" hidden></div>
<div class="toast" id="toast" role="status"><span id="toastT"></span><button id="undo" hidden>Annuler</button></div>

<script>
const KEY="stock_plombier_v1", SEUIL=3, DEPART=10;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// [nom, catégorie, prix de vente HT indicatif en €]
const DEFAULTS=[
 ["Raccord laiton mâle/femelle 15/21","Raccords",4.5],["Raccord laiton mâle/femelle 20/27","Raccords",6],
 ["Coude cuivre 90° Ø14","Raccords",2.5],["Coude cuivre 90° Ø16","Raccords",3],["Té cuivre égal Ø14","Raccords",3.5],
 ["Manchon cuivre Ø16","Raccords",2],["Raccord PER à sertir Ø16","Raccords",7],["Raccord multicouche Ø16","Raccords",8],
 ["Robinet d'arrêt 1/4 de tour 15/21","Robinetterie",12],["Vanne à sphère 20/27","Robinetterie",15],
 ["Robinet flotteur WC","Robinetterie",18],["Mitigeur lavabo","Robinetterie",85],
 ["Flexible inox 30 cm 15/21","Flexibles",8],["Flexible inox 50 cm 15/21","Flexibles",10],
 ["Joint fibre 15/21 (sachet)","Joints",3],["Joint fibre 20/27 (sachet)","Joints",3.5],["Joint torique assortiment","Joints",9],
 ["Siphon lavabo PVC Ø32","Évacuation",12],["Coude PVC 87° Ø40","Évacuation",2.5],["Coude PVC 87° Ø100","Évacuation",6],
 ["Mécanisme de chasse WC","Sanitaire",45],["Pipe WC coudée","Sanitaire",15],
 ["Rouleau téflon","Consommables",2],["Pâte à joint (tube)","Consommables",8],["Filasse (écheveau)","Consommables",5],
 ["Brasure étain (bobine)","Consommables",25],["Colle PVC (pot)","Consommables",12],["Collier de fixation Ø16","Fixation",1.5]
];
const CONF0={nom:"Mon entreprise de plomberie",adr:"12 rue des Artisans\n75000 Paris",tel:"06 00 00 00 00",mail:"contact@exemple.fr",siret:"123 456 789 00012",taux:70,depl:50,tva:10,valid:30,delai:0,
  ment:"Assurance décennale : à compléter (assureur, n° de contrat, zone couverte).\nPaiement : 30 % d'acompte à la signature, solde à la fin des travaux.\nPénalités de retard : 3 fois le taux d'intérêt légal. Indemnité forfaitaire pour frais de recouvrement : 40 €."};
// Pièces : [nom de la pièce en stock, quantité] ou {nom, pu, q} pour une fourniture hors stock
const PRESTA0=[
 ["Installation de toilettes","Dépose de l'ancien WC, pose et raccordement du nouveau WC, réglage et essais d'étanchéité.",3,290,[["Pipe WC coudée",1],["Robinet d'arrêt 1/4 de tour 15/21",1],["Flexible inox 30 cm 15/21",1],["Joint fibre 15/21 (sachet)",1]]],
 ["Remplacement de flexible","Fermeture de l'eau, remplacement du flexible d'alimentation, contrôle d'étanchéité.",0.5,60,[["Flexible inox 30 cm 15/21",1],["Joint fibre 15/21 (sachet)",1]]],
 ["Installation ballon d'eau chaude 200 L","Dépose de l'ancien chauffe-eau, pose et raccordement du nouveau, groupe de sécurité, mise en eau et essais.",4,790,[{nom:"Chauffe-eau électrique 200 L",pu:420,q:1},{nom:"Groupe de sécurité",pu:35,q:1},["Flexible inox 50 cm 15/21",2],["Rouleau téflon",1]]],
 ["Débouchage de canalisation","Débouchage manuel ou au furet, contrôle de l'écoulement.",1,120,[]],
 ["Remplacement mitigeur lavabo","Dépose de l'ancien robinet, pose et raccordement du mitigeur, contrôle d'étanchéité.",1,150,[["Mitigeur lavabo",1],["Joint fibre 15/21 (sachet)",1]]],
 ["Remplacement mécanisme de chasse","Remplacement du mécanisme de chasse d'eau et réglage.",1,120,[["Mécanisme de chasse WC",1]]],
 ["Remplacement robinet d'arrêt","Remplacement du robinet d'arrêt et contrôle d'étanchéité.",0.5,70,[["Robinet d'arrêt 1/4 de tour 15/21",1],["Rouleau téflon",1]]],
 ["Remplacement siphon","Dépose et pose d'un siphon neuf, contrôle de l'écoulement.",0.5,60,[["Siphon lavabo PVC Ø32",1]]],
 ["Recherche et réparation de fuite","Recherche de la fuite, réparation de la canalisation, contrôle.",1.5,150,[["Manchon cuivre Ø16",1],["Brasure étain (bobine)",1]]]
];

/* ---------- Données ---------- */
let S;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function fresh(){return{items:DEFAULTS.map(([name,cat,prix],i)=>({id:"p"+i,name,cat,ref:"",bou:DEPART,cam:2,seuil:SEUIL,cmd:DEPART-SEUIL,url:"",prix})),log:[]}}
function freshPresta(){
  return PRESTA0.map(([nom,desc,h,forfait,pcs],i)=>({id:"t"+i,nom,desc,h,forfait,pieces:pcs.map(x=>{
    if(!Array.isArray(x)) return {...x};
    const it=S.items.find(p=>p.name===x[0]); return it?{id:it.id,q:x[1]}:{nom:x[0],pu:0,q:x[1]};
  })}));
}
function load(){
  try{S=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){S=null}
  if(!S||!Array.isArray(S.items)) S=fresh();
  S.log=S.log||[];
  const dp={};DEFAULTS.forEach(d=>dp[d[0]]=d[2]);
  S.items.forEach(p=>{if(typeof p.prix!=="number")p.prix=dp[p.name]||0});
  S.conf={...CONF0,...(S.conf||{})};
  if(!Array.isArray(S.presta)) S.presta=freshPresta();
  ["devis","factures","depenses","clients"].forEach(k=>{if(!Array.isArray(S[k]))S[k]=[]});
  if(S.conf.numY&&!S.conf.nD){S.conf.nD={y:S.conf.numY,n:S.conf.num||0}}
  S.items.forEach(p=>{if(typeof p.achat!=="number")p.achat=0});
  S.devis.forEach(d=>{if(!d.clientId)ensureClient(d)});
  save();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function log(t){S.log.unshift({t:Date.now(),txt:t});S.log=S.log.slice(0,200)}
const byId=id=>S.items.find(p=>p.id===id);
const isLow=p=>p.bou<=p.seuil;
const dispo=p=>p.bou-p.cam;
const orderUrl=p=>p.url||("https://www.google.com/search?tbm=shop&q="+encodeURIComponent(p.name+(p.ref?" "+p.ref:"")+" plomberie"));

/* ---------- Toast + annuler ---------- */
let undoSnap=null;
function toast(msg,undo){
  $("#toastT").textContent=msg; $("#undo").hidden=!undo; undoSnap=undo||null;
  const t=$("#toast"); t.classList.add("show"); clearTimeout(toast.h); toast.h=setTimeout(()=>{t.classList.remove("show");undoSnap=null},undo?5000:2400);
}
$("#undo").onclick=()=>{if(!undoSnap)return;const {id,bou,cam}=undoSnap;const p=byId(id);if(p){p.bou=bou;p.cam=cam;log(`Annulé : ${p.name}`);save();render()}undoSnap=null;$("#toast").classList.remove("show")};
const snap=p=>({id:p.id,bou:p.bou,cam:p.cam});

/* ---------- Mouvements ---------- */
function done(p,msg,u){save();render();toast(isLow(p)?`⚠️ ${p.name} : plus que ${p.bou}, à commander`:msg,u)}
function take(p,n){n=Math.min(n,p.cam);if(n<=0)return toast("Plus de pièce dans le camion");const u=snap(p);p.cam-=n;p.bou-=n;log(`Camion −${n} ${p.name} (boutique ${p.bou})`);done(p,`−${n} ${p.name} · reste ${p.cam} au camion`,u)}
function use(p,n){n=Math.min(n,dispo(p));if(n<=0)return toast("Plus rien au dépôt");const u=snap(p);p.bou-=n;log(`Dépôt −${n} ${p.name} (boutique ${p.bou})`);done(p,`−${n} ${p.name}`,u)}
function loadT(p,n){n=Math.min(n,dispo(p));if(n<=0)return toast("Plus rien au dépôt à charger");const u=snap(p);p.cam+=n;log(`Chargé ${n} ${p.name} dans le camion`);save();render();toast(`+${n} ${p.name} au camion`,u)}
function unload(p,n){n=Math.min(n,p.cam);if(n<=0)return;const u=snap(p);p.cam-=n;log(`Remis ${n} ${p.name} au dépôt`);save();render();toast(`${n} remis au dépôt`,u)}
function recv(p,n){if(n<=0)return;const u=snap(p);p.bou+=n;log(`Réception +${n} ${p.name} (boutique ${p.bou})`);save();render();toast(`+${n} ${p.name} reçu`,u)}

/* ---------- Écrans ---------- */
let view="camion", camMode="in", q="";
const match=p=>{const s=q.trim().toLowerCase();return !s||(p.name+" "+p.ref+" "+p.cat).toLowerCase().includes(s)};
const row=(p,meta,right)=>`<div class="row ${isLow(p)?"low":""}" data-id="${p.id}"><button class="main" data-x="open"><span class="nm">${esc(p.name)}</span><span class="meta">${meta}</span></button>${right}</div>`;
const lo=(p,txt)=>isLow(p)?`<span class="lo">${txt}</span>`:txt;
function grouped(list,fn){
  const g={};list.forEach(p=>(g[p.cat||"Autres"]=g[p.cat||"Autres"]||[]).push(p));
  return Object.keys(g).sort((a,b)=>a.localeCompare(b,"fr")).map(c=>`<div class="grp">${esc(c)}</div><div class="list">${g[c].map(fn).join("")}</div>`).join("");
}
const searchBox=()=>`<input class="search" id="q" type="search" placeholder="Rechercher une pièce…" value="${esc(q)}" autocomplete="off">`;

function render(){
  const low=S.items.filter(isLow);
  $("#dot").hidden=!low.length; $("#dot").textContent=low.length;
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===view||(b.dataset.v==="boutique"&&view==="commande")));
  $("#addBtn").hidden=view!=="boutique";
  const al=$("#alert"); al.hidden=!low.length||view!=="camion"&&view!=="boutique";
  al.textContent=`⚠️ ${low.length} pièce${low.length>1?"s":""} à commander →`;
  const V=$("#view");

  if(view==="camion"){
    $("#title").textContent="Camion";
    const inT=S.items.filter(p=>p.cam>0);
    const seg=`<div class="seg"><button data-m="in" class="${camMode==="in"?"on":""}">Dans le camion</button><button data-m="load" class="${camMode==="load"?"on":""}">+ Charger</button></div>`;
    if(camMode==="in"){
      const L=inT.filter(match);
      V.innerHTML=seg+searchBox()+(L.length?grouped(L,p=>row(p,`Camion ${p.cam} · ${lo(p,"Boutique "+p.bou)}`,`<button class="big" data-x="take" aria-label="Prendre 1 ${esc(p.name)}">−1</button>`))
        :`<div class="empty">${q?"Aucune pièce trouvée.":"Le camion est vide.<br>Appuie sur « + Charger »."}</div>`);
    }else{
      const L=S.items.filter(p=>dispo(p)>0).filter(match);
      V.innerHTML=seg+searchBox()+(L.length?grouped(L,p=>row(p,`Au dépôt ${dispo(p)} · Camion ${p.cam}`,`<button class="big alt" data-x="load1" aria-label="Charger 1 ${esc(p.name)}">+1</button>`))
        :`<div class="empty">${q?"Aucune pièce trouvée.":"Plus rien au dépôt à charger."}</div>`);
    }
  }
  else if(view==="boutique"){
    $("#title").textContent="Boutique";
    const L=S.items.filter(match);
    V.innerHTML=bseg(low.length)+searchBox()+(L.length?grouped(L,p=>row(p,`${p.ref?esc(p.ref)+" · ":""}dont ${p.cam} au camion`,`<div class="num ${isLow(p)?"lo":""}">${p.bou}</div>`))
      :'<div class="empty">Aucune pièce trouvée.</div>');
  }
  else if(view==="devis") renderDevisTab(V);
  else if(view==="factures") renderFact(V);
  else if(view==="clients") renderClients(V);
  else{
    $("#title").textContent="Boutique";
    V.innerHTML=bseg(low.length)+(low.length
      ?`<div class="list">${low.sort((a,b)=>a.bou-b.bou).map(p=>row(p,`Reste <span class="lo">${p.bou}</span> · commander ${p.cmd}`,`<a class="big acc" href="${esc(orderUrl(p))}" target="_blank" rel="noopener">Commander</a>`)).join("")}</div>
        <div class="acts" style="margin-top:12px"><button class="act" data-x="share">Copier la liste pour le fournisseur</button></div>
        <p class="sub" style="margin-top:10px">Appuie sur une pièce quand la commande arrive pour la marquer reçue.</p>`
      :'<div class="empty">Rien à commander. Tout est au-dessus du seuil.</div>');
  }
}

const bseg=n=>`<div class="seg"><button data-x="goView" data-v2="boutique" class="${view==="boutique"?"on":""}">Stock</button><button data-x="goView" data-v2="commande" class="${view==="commande"?"on":""}">À commander${n?` (${n})`:""}</button></div>`;

/* ---------- Feuille du bas ---------- */
let cur=null, qtyFn=null;
const dlg=$("#dlg");
function sheet(html){$("#sh").innerHTML=html;if(!dlg.open)dlg.showModal();$("#sh").scrollTop=0}
const close=()=>dlg.close();
dlg.addEventListener("click",e=>{if(e.target===dlg)close()});

function openItem(p){
  cur=p;
  const a=[];
  if(p.cam>0) a.push(`<button class="act" data-x="takeN">Prendre dans le camion…</button>`);
  if(dispo(p)>0) a.push(`<button class="act" data-x="loadN">Charger dans le camion…</button>`);
  if(dispo(p)>0) a.push(`<button class="act" data-x="useN">Utiliser au dépôt…</button>`);
  if(p.cam>0) a.push(`<button class="act" data-x="unloadN">Remettre au dépôt…</button>`);
  a.push(`<button class="act" data-x="recvN">Commande reçue…</button>`);
  sheet(`<h2>${esc(p.name)}</h2>${p.ref||p.cat?`<p class="sub">${esc([p.ref,p.cat].filter(Boolean).join(" · "))}</p>`:""}
    ${p.prix?`<p class="sub">Prix de vente : ${eur(p.prix)} HT</p>`:""}
    <div class="nums"><div><small>Boutique</small><b class="${isLow(p)?"lo":""}">${p.bou}</b></div><div><small>Camion</small><b>${p.cam}</b></div><div><small>Seuil</small><b>${p.seuil}</b></div></div>
    <a class="act acc" href="${esc(orderUrl(p))}" target="_blank" rel="noopener">Commander ↗</a>
    <div class="acts">${a.join("")}<button class="act" data-x="edit">Modifier la fiche</button></div>
    <button class="act ghost" data-x="close">Fermer</button>`);
}
function askQty(title,sub,def,fn){
  qtyFn=fn;
  sheet(`<h2>${esc(title)}</h2><p class="sub">${esc(sub)}</p>
    <div class="step"><button data-x="minus" aria-label="Moins">−</button><input id="qN" type="number" min="1" inputmode="numeric" value="${def}"><button data-x="plus" aria-label="Plus">+</button></div>
    <div class="two"><button class="act ghost" data-x="close">Annuler</button><button class="act pri" data-x="qok">Valider</button></div>`);
}
function confirmBox(msg,fn){qtyFn=fn;sheet(`<h2>${esc(msg)}</h2><div class="two"><button class="act" data-x="close">Annuler</button><button class="act pri" data-x="cok" style="background:var(--bad);border-color:var(--bad);color:#fff">Confirmer</button></div>`)}
function textBox(title,sub,txt){sheet(`<h2>${esc(title)}</h2><p class="sub">${esc(sub)}</p><textarea id="tX" readonly>${esc(txt)}</textarea><div class="two"><button class="act" data-x="copy">Copier</button><button class="act pri" data-x="close">Fermer</button></div>`)}
function editItem(p){
  cur=p||null;
  const f=(id,lab,val,type="text",extra="")=>`<div class="fld"><label for="${id}">${lab}</label><input id="${id}" type="${type}" value="${esc(val)}" ${extra}></div>`;
  sheet(`<h2>${p?"Modifier la pièce":"Nouvelle pièce"}</h2>
    ${f("fName","Nom de la pièce",p?p.name:"","text",'placeholder="ex : Raccord laiton 15/21"')}
    <div class="two">${f("fRef","Référence",p?p.ref:"")}${f("fCat","Catégorie",p?p.cat:"","text",'list="cats"')}</div>
    <datalist id="cats">${[...new Set(S.items.map(x=>x.cat).filter(Boolean))].map(c=>`<option value="${esc(c)}">`).join("")}</datalist>
    <div class="two">${f("fBou","Stock boutique",p?p.bou:DEPART,"number",'min="0" inputmode="numeric"')}${f("fCam","Dont au camion",p?p.cam:0,"number",'min="0" inputmode="numeric"')}</div>
    <div class="two">${f("fSeuil","Seuil d'alerte",p?p.seuil:SEUIL,"number",'min="0" inputmode="numeric"')}${f("fCmd","Qté à commander",p?p.cmd:DEPART-SEUIL,"number",'min="1" inputmode="numeric"')}</div>
    <div class="two">${f("fAchat","Prix d'achat HT (€)",p&&p.achat?String(p.achat).replace(".",","):"","text",'inputmode="decimal" placeholder="ex : 7,20"')}${f("fPrix","Prix de vente HT (€)",p?String(p.prix||0).replace(".",","):"","text",'inputmode="decimal" placeholder="ex : 12,50"')}</div>
    ${f("fUrl","Lien du produit chez le fournisseur",p?p.url:"","url",'placeholder="https://…"')}
    <div class="two"><button class="act ghost" data-x="close">Annuler</button><button class="act pri" data-x="saveItem">Enregistrer</button></div>
    ${p?'<button class="act danger" data-x="del">Supprimer la pièce</button>':""}`);
}
function menu(){
  sheet(`<h2>Menu</h2><div class="acts">
    <button class="act" data-x="d_conf">Mon entreprise et mes tarifs</button>
    <button class="act" data-x="d_prestas">Mes travaux et forfaits</button>
    <button class="act" data-x="hist">Historique des mouvements</button>
    <button class="act" data-x="new">Ajouter une pièce</button>
    <button class="act" data-x="exp">Sauvegarder mes données</button>
    <button class="act" data-x="imp">Restaurer une sauvegarde</button>
    <button class="act danger" data-x="reset">Tout remettre à zéro</button></div>
    <button class="act ghost" data-x="close">Fermer</button>`);
}
function hist(){
  sheet(`<h2>Historique</h2><div class="loglist">${S.log.length?S.log.map(l=>`<div class="log"><div>${esc(l.txt)}</div><span>${new Date(l.t).toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}</span></div>`).join(""):'<p class="sub">Aucun mouvement pour l\'instant.</p>'}</div><button class="act pri" data-x="close">Fermer</button>`);
}
function saveItem(){
  const v=id=>$(id).value.trim(), n=(id,d)=>{const x=parseInt($(id).value,10);return isNaN(x)||x<0?d:x};
  const name=v("#fName"); if(!name){toast("Donne un nom à la pièce");$("#fName").focus();return}
  const d={name,ref:v("#fRef"),cat:v("#fCat"),bou:n("#fBou",DEPART),seuil:n("#fSeuil",SEUIL),cmd:Math.max(1,n("#fCmd",DEPART-SEUIL)),url:v("#fUrl"),prix:num($("#fPrix").value),achat:num($("#fAchat").value)};
  d.cam=Math.min(n("#fCam",0),d.bou);
  if(d.url&&!/^https?:\/\//i.test(d.url))d.url="https://"+d.url;
  if(cur){Object.assign(cur,d);log(`Fiche modifiée : ${name}`)}else{S.items.push({id:uid(),...d});log(`Nouvelle pièce : ${name} (${d.bou})`)}
  save();close();render();toast("Pièce enregistrée");
}
function copyText(txt){
  const sel=()=>{const t=$("#tX");if(t){t.focus();t.select()}toast("Texte sélectionné, fais Copier")};
  try{navigator.clipboard.writeText(txt).then(()=>toast("Copié"),sel)}catch(e){sel()}
}

/* ---------- Clics ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-x],[data-m],nav button"); if(!b) return;
  if(b.dataset.v){view=b.dataset.v;q="";camMode="in";edId=null;cliId=null;cq="";render();scrollTo(0,0);return}
  if(b.dataset.m){camMode=b.dataset.m;render();return}
  if(b.dataset.x&&/^[dfc]_/.test(b.dataset.x)) return devisClick(b,e);
  const host=b.closest("[data-id]"), p=host?byId(host.dataset.id):cur;
  const nv=()=>parseInt($("#qN").value,10)||0;
  switch(b.dataset.x){
    case "open": return camMode==="load"&&view==="camion"?askQty("Charger dans le camion",`${p.name} · ${dispo(p)} au dépôt`,Math.min(2,dispo(p)),n=>loadT(p,n)):openItem(p);
    case "take": return take(p,1);
    case "load1": return loadT(p,1);
    case "takeN": return askQty("Prendre dans le camion",`${p.name} · ${p.cam} au camion`,1,n=>take(p,n));
    case "loadN": return askQty("Charger dans le camion",`${p.name} · ${dispo(p)} au dépôt`,Math.min(2,dispo(p)),n=>loadT(p,n));
    case "useN": return askQty("Utiliser au dépôt",`${p.name} · ${dispo(p)} au dépôt`,1,n=>use(p,n));
    case "unloadN": return askQty("Remettre au dépôt",`${p.name} · ${p.cam} au camion`,p.cam,n=>unload(p,n));
    case "recvN": return recvSheet(p);
    case "minus": $("#qN").value=Math.max(1,nv()-1); return;
    case "plus": $("#qN").value=nv()+1; return;
    case "qok": {const n=nv(),f=qtyFn;qtyFn=null;close();if(n>0&&f)f(n);else toast("Mets une quantité d'au moins 1");return}
    case "cok": {const f=qtyFn;qtyFn=null;close();if(f)f();return}
    case "edit": return editItem(p);
    case "new": return editItem(null);
    case "saveItem": return saveItem();
    case "del": {const it=cur;return confirmBox(`Supprimer « ${it.name} » ?`,()=>{S.items=S.items.filter(x=>x!==it);log(`Pièce supprimée : ${it.name}`);save();render();toast("Pièce supprimée")})}
    case "share": {const low=S.items.filter(isLow);return textBox("Liste de commande","Copie-la puis colle-la dans un SMS ou un mail.","Commande plomberie :\n"+low.map(x=>`- ${x.cmd} × ${x.name}${x.ref?" ("+x.ref+")":""}${x.url?" : "+x.url:""}`).join("\n"))}
    case "copy": return copyText($("#tX").value);
    case "hist": return hist();
    case "exp": return textBox("Sauvegarde","Copie ce texte et garde-le dans tes notes ou un mail. Pour restaurer, mets-le dans un fichier .json.",JSON.stringify(S));
    case "imp": {close();const i=document.createElement("input");i.type="file";i.accept="application/json,.json,.txt";i.onchange=()=>{const f=i.files[0];if(!f)return;f.text().then(t=>{const d=JSON.parse(t);if(!Array.isArray(d.items))throw 0;S={...d,log:d.log||[]};localStorage.setItem(KEY,JSON.stringify(S));load();render();toast("Sauvegarde restaurée")}).catch(()=>toast("Fichier invalide : ce n'est pas une sauvegarde du stock"))};i.click();return}
    case "reset": return confirmBox("Remettre le stock à zéro ? (devis, factures et clients sont gardés)",()=>{const k={conf:S.conf,presta:S.presta,devis:S.devis,factures:S.factures,depenses:S.depenses,clients:S.clients};S={...fresh(),...k};save();render();toast("Stock remis à zéro")});
    case "goView": view=b.dataset.v2; render(); scrollTo(0,0); return;
    case "close": return close();
  }
});
$("#menuBtn").onclick=menu;
$("#addBtn").onclick=()=>editItem(null);
$("#alert").onclick=()=>{view="commande";render();scrollTo(0,0)};
$("#view").addEventListener("input",e=>{if(e.target.id!=="q")return;q=e.target.value;const pos=e.target.selectionStart;render();const i=$("#q");i.focus();i.setSelectionRange(pos,pos)});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&dlg.open){const ok=$("#sh [data-x=qok],#sh [data-x=saveItem]");if(ok&&e.target.tagName==="INPUT"){e.preventDefault();ok.click()}}});

/* ================= DEVIS, FACTURES, DÉPENSES, CLIENTS ================= */
let edId=null, edKind="devis", pickFn=null, prEd=null, depEd=null, cliId=null, fMode="fac", cq="";
function num(v){const x=parseFloat(String(v??"").replace(/\s/g,"").replace(",","."));return isNaN(x)?0:x}
function eur(n){return (Math.round(n*100)/100).toLocaleString("fr-FR",{style:"currency",currency:"EUR"})}
const r2=n=>Math.round(n*100)/100;
const fr=n=>String(n).replace(".",",");
const hfmt=h=>fr(h)+" h";
const dfr=d=>new Date(d+"T12:00:00").toLocaleDateString("fr-FR");
const todayISO=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const addDays=(iso,n)=>{const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+n);return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const arr=k=>k==="facture"?S.factures:S.devis;
const curD=()=>arr(edKind).find(d=>d.id===edId);
const cliById=id=>S.clients.find(c=>c.id===id);
function lineTotal(d,l){return l.mode==="forfait"?num(l.forfait):l.h*d.taux+l.pieces.reduce((a,x)=>a+x.pu*x.q,0)}
function totals(d){const ht=d.lignes.reduce((a,l)=>a+lineTotal(d,l),0)+(d.depl?d.deplPrix:0);const tva=ht*d.tva/100;return{ht,tva,ttc:ht+tva}}
function nextNum(pfx){
  const c=S.conf, y=new Date().getFullYear(), k="n"+pfx;
  if(!c[k]||c[k].y!==y) c[k]={y,n:0};
  c[k].n++; return `${pfx}-${y}-${String(c[k].n).padStart(3,"0")}`;
}
const dueISO=f=>addDays(f.date,parseInt(S.conf.delai,10)||0);
const isLate=f=>f.statut!=="payee"&&(parseInt(S.conf.delai,10)||0)>0&&dueISO(f)<todayISO();
function fStatus(f){return f.statut==="payee"?'<span style="color:var(--ok);font-weight:700">payée</span>':isLate(f)?'<span class="lo">en retard</span>':"à payer"}

/* --- Clients liés aux documents --- */
function ensureClient(d){
  const n=(d.client.nom||"").trim(); if(!n) return;
  let c=d.clientId&&cliById(d.clientId);
  if(!c){c=S.clients.find(x=>x.nom.trim().toLowerCase()===n.toLowerCase());if(!c){c={id:uid(),nom:n,adr:"",tel:"",mail:"",notes:""};S.clients.push(c)}d.clientId=c.id}
  c.nom=n; if(d.client.adr) c.adr=d.client.adr; if(d.client.tel) c.tel=d.client.tel;
  save();
}
function newDoc(kind,cl){
  const c=S.conf;
  const d={id:uid(),num:nextNum(kind==="facture"?"F":"D"),date:todayISO(),clientId:cl?cl.id:null,client:cl?{nom:cl.nom,adr:cl.adr,tel:cl.tel}:{nom:"",adr:"",tel:""},lignes:[],depl:true,deplPrix:num(c.depl),taux:num(c.taux),tva:num(c.tva),stockDone:false,statut:kind==="facture"?"a_payer":"brouillon",paye:null};
  arr(kind).unshift(d); save(); openDoc(kind,d.id);
}
function openDoc(kind,id){edKind=kind;edId=id;cliId=null;view=kind==="facture"?"factures":"devis";render();scrollTo(0,0)}
function toFacture(d){
  ensureClient(d);
  const f=JSON.parse(JSON.stringify(d));
  Object.assign(f,{id:uid(),num:nextNum("F"),date:todayISO(),statut:"a_payer",paye:null,devisId:d.id,devisNum:d.num});
  delete f.factureId; delete f.factureNum;
  S.factures.unshift(f); d.factureId=f.id; d.factureNum=f.num; d.statut="accepte";
  save(); openDoc("facture",f.id); toast(`Facture ${f.num} créée`);
}
function pieceSnap(x){if(x.id){const it=byId(x.id);return it?{id:it.id,nom:it.name,pu:it.prix||0,q:x.q}:null}return{nom:x.nom,pu:num(x.pu),q:x.q}}
const prestaToLine=t=>({nom:t.nom,desc:t.desc,mode:"temps",h:t.h,forfait:t.forfait,pieces:t.pieces.map(pieceSnap).filter(Boolean)});

/* --- Onglet Devis --- */
function renderDevisTab(V){
  const d=edKind==="devis"?curD():null;
  if(d) return renderEditor(V,d,"devis");
  $("#title").textContent="Devis";

/* --- Onglet Factures --- */
function renderFact(V){
  const d=edKind==="facture"?curD():null;
  if(d) return renderEditor(V,d,"facture");
  $("#title").textContent="Factures";
  const m=todayISO().slice(0,7), mois=new Date().toLocaleDateString("fr-FR",{month:"long",year:"numeric"});
  const facM=S.factures.filter(f=>f.date.slice(0,7)===m).reduce((a,f)=>a+totals(f).ht,0);
  const encM=S.factures.filter(f=>f.statut==="payee"&&f.paye&&f.paye.date.slice(0,7)===m).reduce((a,f)=>a+totals(f).ttc,0);
  const due=S.factures.filter(f=>f.statut!=="payee"), dueT=due.reduce((a,f)=>a+totals(f).ttc,0);
  const depM=S.depenses.filter(e=>e.date.slice(0,7)===m), depT=depM.reduce((a,e)=>a+e.ttc,0), depHT=depM.reduce((a,e)=>a+e.ttc/(1+e.tva/100),0);
  const seg=`<div class="seg"><button data-x="f_mode" data-v2="fac" class="${fMode==="fac"?"on":""}">Factures</button><button data-x="f_mode" data-v2="dep" class="${fMode==="dep"?"on":""}">Dépenses</button></div>`;
  const sum=`<div class="card"><div class="grp" style="margin:0">${esc(mois)}</div>
    <div class="nums"><div><small>Facturé HT</small><b>${eur(facM).replace(/,\d\d/,"")}</b></div><div><small>Dépenses TTC</small><b>${eur(depT).replace(/,\d\d/,"")}</b></div><div><small>À encaisser</small><b class="${due.length?"lo":""}">${eur(dueT).replace(/,\d\d/,"")}</b></div></div>
    <p class="sub">Encaissé ce mois : ${eur(encM)} · Résultat estimé : ${eur(facM-depHT)} HT</p></div>`;
  if(fMode==="fac"){
    const acc=S.devis.filter(x=>x.statut==="accepte"&&!x.factureId);
    V.innerHTML=seg+sum+`<div class="acts" style="margin-bottom:12px">${acc.length?`<button class="act pri" data-x="f_fromDevis">Facturer un devis accepté (${acc.length})</button>`:""}<button class="act ${acc.length?"":"pri"}" data-x="f_new">+ Nouvelle facture</button></div>`
      +(S.factures.length?`<div class="list">${S.factures.map(f=>`<div class="row ${isLate(f)?"low":""}"><button class="main" data-x="d_open" data-k="facture" data-did="${f.id}"><span class="nm">${esc(f.client.nom||"Client à renseigner")}</span><span class="meta">${esc(f.num)} · ${dfr(f.date)} · ${fStatus(f)}</span></button><span class="num" style="font-size:20px">${eur(totals(f).ttc)}</span></div>`).join("")}</div>`
      :'<div class="empty">Aucune facture pour l\'instant.<br>Accepte un devis puis « Transformer en facture », ou crée une facture directement.</div>');
  }else{
    const g={};S.depenses.slice().sort((a,b)=>b.date.localeCompare(a.date)).forEach(e=>(g[e.date.slice(0,7)]=g[e.date.slice(0,7)]||[]).push(e));
    V.innerHTML=seg+sum+`<div class="acts" style="margin-bottom:4px"><button class="act pri" data-x="f_dep">+ Ajouter une dépense</button></div>`
      +(S.depenses.length?Object.keys(g).map(k=>`<div class="grp">${esc(new Date(k+"-15T12:00:00").toLocaleDateString("fr-FR",{month:"long",year:"numeric"}))} · ${eur(g[k].reduce((a,e)=>a+e.ttc,0))}</div><div class="list">${g[k].map(e=>`<div class="row"><button class="main" data-x="f_depEdit" data-eid="${e.id}"><span class="nm">${esc(e.lib||e.cat)}</span><span class="meta">${esc(e.cat)} · ${dfr(e.date)} · TVA ${fr(e.tva)} %</span></button><span class="num" style="font-size:20px">${eur(e.ttc)}</span></div>`).join("")}</div>`).join("")
      :'<div class="empty">Aucune dépense enregistrée.<br>Essence, repas, péage, pièces… ajoute-les ici.</div>')
      +`<p class="sub" style="margin-top:10px">Les commandes de pièces reçues (Boutique → pièce → Commande reçue) peuvent s'ajouter ici automatiquement.</p>`;
  }
}

   <button class="link" data-x="d_tAddP">+ Ajouter une pièce</button></div>
   <div class="two"><button class="act ghost" data-x="d_prestas">Annuler</button><button class="act pri" data-x="d_tSave">Enregistrer</button></div>
   ${t._new?"":'<button class="act danger" data-x="d_tDel">Supprimer ces travaux</button>'}`);
}
function grabT(){prEd.nom=$("#tN").value.trim();prEd.desc=$("#tD").value.trim();prEd.h=num($("#tH").value);prEd.forfait=num($("#tF").value)}

/* --- Réglages entreprise --- */
function confSheet(){
  const c=S.conf, f=(id,lab,val,extra="")=>`<div class="fld"><label for="${id}">${lab}</label><input id="${id}" value="${esc(val)}" ${extra}></div>`;
  sheet(`<h2>Mon entreprise et mes tarifs</h2>
   ${f("kNom","Nom de l'entreprise",c.nom)}
   <div class="fld"><label for="kAdr">Adresse</label><textarea class="ta" id="kAdr" rows="2">${esc(c.adr)}</textarea></div>
   <div class="two">${f("kTel","Téléphone",c.tel,'type="tel"')}${f("kMail","E-mail",c.mail,'type="email"')}</div>
   ${f("kSiret","SIRET",c.siret,'inputmode="numeric"')}
   <div class="two">${f("kTaux","Taux horaire HT (€)",fr(c.taux),'inputmode="decimal"')}${f("kDepl","Déplacement HT (€)",fr(c.depl),'inputmode="decimal"')}</div>
   <div class="two">${f("kTva","TVA par défaut (%)",fr(c.tva),'inputmode="decimal"')}${f("kVal","Validité du devis (jours)",c.valid,'inputmode="numeric"')}</div>
   ${f("kDelai","Délai de paiement des factures (jours, 0 = à réception)",c.delai,'inputmode="numeric"')}
   <div class="fld"><label for="kMent">Mentions en bas des devis et factures</label><textarea class="ta" id="kMent" rows="5">${esc(c.ment)}</textarea></div>
   <p class="sub">Les nouveaux tarifs s'appliquent aux prochains devis et factures.</p>
   <div class="two"><button class="act ghost" data-x="close">Annuler</button><button class="act pri" data-x="d_confOk">Enregistrer</button></div>`);
}

/* --- Retrait du stock --- */
function stockOut(d){
  let n=0;
  d.lignes.forEach(l=>l.pieces.forEach(x=>{if(!x.id)return;const p=byId(x.id);if(!p)return;const k=Math.min(x.q,p.bou);p.cam-=Math.min(p.cam,k);p.bou-=k;n+=k}));
  d.stockDone=true;
  const twin=d.devisId?S.devis.find(x=>x.id===d.devisId):d.factureId?S.factures.find(x=>x.id===d.factureId):null; if(twin) twin.stockDone=true;
  log(`${d.num} : ${n} pièce(s) retirée(s) du stock`); save(); render();
  const low=S.items.filter(isLow).length;
  toast(`${n} pièce${n>1?"s":""} retirée${n>1?"s":""} du stock${low?` · ${low} à commander`:""}`);
}

/* --- Document imprimable --- */
function docText(d,F){
  const t=totals(d);
  let s=`${F?"FACTURE":"DEVIS"} ${d.num} du ${dfr(d.date)}\n${S.conf.nom} · SIRET ${S.conf.siret}\nClient : ${d.client.nom||"—"}\n\n`;
  d.lignes.forEach(l=>{s+=`- ${l.nom} : ${eur(lineTotal(d,l))} HT${l.mode==="forfait"?" (forfait)":` (${hfmt(l.h)} de main-d'œuvre + pièces)`}\n`});
  if(d.depl) s+=`- Déplacement : ${eur(d.deplPrix)} HT\n`;
  return s+`\nTotal HT : ${eur(t.ht)}\nTVA ${fr(d.tva)} % : ${eur(t.tva)}\nTotal TTC : ${eur(t.ttc)}`;
}
function showDoc(d,F){
  const c=S.conf, t=totals(d), delai=parseInt(c.delai,10)||0;
  let rows="";
  d.lignes.forEach(l=>{
    rows+=`<tr class="ti"><td colspan="4">${esc(l.nom)}${l.desc?`<span class="ds">${esc(l.desc)}</span>`:""}</td></tr>`;
    if(l.mode==="forfait"){
      rows+=`<tr><td>Forfait main-d'œuvre et fournitures</td><td class="r">1</td><td class="r">${eur(num(l.forfait))}</td><td class="r">${eur(num(l.forfait))}</td></tr>`;
      l.pieces.forEach(x=>rows+=`<tr><td class="inc">${esc(x.nom)} (compris)</td><td class="r inc">${x.q}</td><td></td><td></td></tr>`);
    }else{
      rows+=`<tr><td>Main-d'œuvre</td><td class="r">${hfmt(l.h)}</td><td class="r">${eur(d.taux)}</td><td class="r">${eur(l.h*d.taux)}</td></tr>`;
      l.pieces.forEach(x=>rows+=`<tr><td>${esc(x.nom)}</td><td class="r">${x.q}</td><td class="r">${eur(x.pu)}</td><td class="r">${eur(x.pu*x.q)}</td></tr>`);
    }
  });
  if(d.depl) rows+=`<tr class="ti"><td colspan="4">Déplacement</td></tr><tr><td>Frais de déplacement</td><td class="r">1</td><td class="r">${eur(d.deplPrix)}</td><td class="r">${eur(d.deplPrix)}</td></tr>`;
  const meta=F?`N° ${esc(d.num)}
Date : ${dfr(d.date)}${d.devisNum?"\nRéf. devis : "+esc(d.devisNum):""}
Échéance : ${delai?dfr(dueISO(d)):"à réception"}`
    :`N° ${esc(d.num)}
Date : ${dfr(d.date)}
Valable jusqu'au ${dfr(addDays(d.date,parseInt(c.valid,10)||30))}`;
  const ment=(F?`Date de la prestation : ${dfr(d.date)}. Conditions de paiement : ${delai?`à ${delai} jours, soit le ${dfr(dueISO(d))}`:"à réception de la facture"}. Pas d'escompte pour paiement anticipé.`
    :`Devis gratuit. Taux horaire de main-d'œuvre : ${eur(d.taux)} HT.`)
    +(d.tva<20?"\nTVA à taux réduit : attestation du client requise (logement achevé depuis plus de 2 ans).":"")+"\n"+esc(c.ment);
  const inFrame=(()=>{try{return window.self!==window.top}catch(e){return true}})();
  $("#doc").innerHTML=`<div class="docbar"><button class="act" data-x="d_docClose">← Retour</button><span class="sp"></span>${inFrame?"":'<button class="act pri" data-x="d_print">PDF / Imprimer</button>'}<button class="act" data-x="d_copy">Copier</button></div>
  <div class="paper">
   <div class="ph"><div class="co"><b>${esc(c.nom)}</b>
${esc(c.adr)}
Tél. ${esc(c.tel)}
${esc(c.mail)}
SIRET ${esc(c.siret)}</div>
   <div class="meta2"><h1>${F?"FACTURE":"DEVIS"}</h1>${meta}</div></div>
   <div class="cli"><small>Client</small>${esc(d.client.nom||"—")}${d.client.adr?"\n"+esc(d.client.adr):""}${d.client.tel?"\nTél. "+esc(d.client.tel):""}</div>
   <div class="tw"><table><thead><tr><th>Désignation</th><th class="r">Qté</th><th class="r">PU HT</th><th class="r">Total HT</th></tr></thead><tbody>${rows||'<tr><td colspan="4">Aucun travaux ajoutés.</td></tr>'}</tbody></table></div>
   <div class="ptot"><div><span>Total HT</span><span>${eur(t.ht)}</span></div><div><span>TVA ${fr(d.tva)} %</span><span>${eur(t.tva)}</span></div><div class="g"><span>${F?"Net à payer TTC":"Total TTC"}</span><span>${eur(t.ttc)}</span></div></div>
   ${F&&d.statut==="payee"?`<p style="margin:12px 0 0;font-weight:700;color:var(--phead)">Facture acquittée le ${dfr(d.paye.date)} par ${esc(d.paye.mode.toLowerCase())}.</p>`:""}
   <div class="ment">${ment}</div>
   ${F?"":'<div class="sign"><div>Date et signature du client, précédées de la mention « Bon pour accord »</div><div>Signature et cachet de l\'entreprise</div></div>'}
  </div>`;
  $("#doc").hidden=false; $("#doc").scrollTop=0;
}

/* --- Clics --- */
function devisClick(b){
  const x=b.dataset.x, d=curD(), F=edKind==="facture";
  const li=b.closest("[data-li]"), L=li&&d?d.lignes[+li.dataset.li]:null;
  const pi=b.closest("[data-pi]");
  switch(x){
    case "d_new": return newDoc("devis");
    case "f_new": return newDoc("facture");
    case "d_open": return openDoc(b.dataset.k,b.dataset.did);
    case "d_back": if(d) ensureClient(d); edId=null; render(); scrollTo(0,0); return;
    case "d_addT": return pickPresta();
    case "d_pickT": {const t=S.presta.find(p=>p.id===b.dataset.t); close(); if(t&&d){d.lignes.push(prestaToLine(t)); save(); render(); toast("Travaux ajoutés")} return}
    case "d_free": return sheet(`<h2>Autres travaux</h2><div class="fld"><label for="wN">Intitulé</label><input id="wN" placeholder="ex : Remplacement vanne d'arrivée"></div><div class="fld"><label for="wD">Description</label><textarea class="ta" id="wD" rows="3"></textarea></div><div class="two"><button class="act ghost" data-x="close">Annuler</button><button class="act pri" data-x="d_freeOk">Ajouter</button></div>`);
    case "d_freeOk": {const nom=$("#wN").value.trim(); if(!nom){toast("Écris un intitulé");return} d.lignes.push({nom,desc:$("#wD").value.trim(),mode:"temps",h:1,forfait:0,pieces:[]}); close(); save(); render(); toast("Travaux ajoutés"); return}
    case "d_rmL": {const i=+li.dataset.li; return confirmBox(`Retirer « ${L.nom} » ?`,()=>{d.lignes.splice(i,1);save();render()})}
    case "d_mode": L.mode=b.dataset.v2; save(); render(); return;
    case "d_h": L.h=Math.max(0,Math.round((L.h+num(b.dataset.v2))*2)/2); save(); render(); return;
    case "d_pq": {const j=+pi.dataset.pi, P=L.pieces[j]; P.q+=num(b.dataset.v2); if(P.q<=0) L.pieces.splice(j,1); save(); render(); return}
    case "d_addP": return pickPiece(P=>{L.pieces.push(P);save();render();toast("Pièce ajoutée")});
    case "d_pick": {const it=byId(b.dataset.pid), f=pickFn; pickFn=null; close(); if(f&&it) f({id:it.id,nom:it.name,pu:it.prix||0,q:1}); return}
    case "d_pickFree": return sheet(`<h2>Fourniture hors stock</h2><div class="fld"><label for="fpN">Désignation</label><input id="fpN" placeholder="ex : Cuvette WC suspendue"></div><div class="fld"><label for="fpP">Prix unitaire HT (€)</label><input id="fpP" inputmode="decimal" placeholder="ex : 180"></div><div class="two"><button class="act ghost" data-x="close">Annuler</button><button class="act pri" data-x="d_freeP">Ajouter</button></div>`);
    case "d_freeP": {const nom=$("#fpN").value.trim(); if(!nom){toast("Écris la désignation");return} const f=pickFn; pickFn=null; const P={nom,pu:num($("#fpP").value),q:1}; close(); if(f) f(P); return}
    case "d_depl": d.depl=b.checked; save(); render(); return;
    case "d_tva": d.tva=num(b.dataset.v2); save(); render(); return;
    case "d_pickC": return pickClient();
    case "d_setC": {const c=cliById(b.dataset.cid); close(); if(c&&d){d.clientId=c.id; d.client={nom:c.nom,adr:c.adr,tel:c.tel}; save(); render()} return}
    case "d_goC": ensureClient(d); cliId=d.clientId; edId=null; view="clients"; render(); scrollTo(0,0); return;
    case "d_doc": ensureClient(d); return showDoc(d,F);
    case "d_docClose": $("#doc").hidden=true; return;
    case "d_print": window.print(); return;
    case "d_copy": {const t=docText(d,F);try{navigator.clipboard.writeText(t).then(()=>toast("Copié"),()=>textBox(F?"Facture":"Devis","",t))}catch(e){textBox(F?"Facture":"Devis","",t)}return}
    case "d_status": d.statut=d.statut==="accepte"?"brouillon":"accepte"; ensureClient(d); save(); render(); toast(d.statut==="accepte"?"Devis accepté":"Devis repassé en brouillon"); return;
    case "d_conv": return toFacture(d);
    case "d_goF": return openDoc("facture",d.factureId);
    case "d_pay": return sheet(`<h2>Facture payée</h2><p class="sub">${esc(d.num)} · ${eur(totals(d).ttc)} TTC</p><div class="fld"><label for="pyD">Date du paiement</label><input id="pyD" type="date" value="${todayISO()}"></div><label>Moyen de paiement</label><div class="acts">${["Virement","Chèque","Espèces","Carte bancaire"].map(m=>`<button class="act" data-x="d_payOk" data-v2="${m}">${m}</button>`).join("")}</div><button class="act ghost" data-x="close">Annuler</button>`);
    case "d_payOk": d.statut="payee"; d.paye={date:$("#pyD").value||todayISO(),mode:b.dataset.v2}; close(); save(); render(); toast("Facture marquée payée"); return;
    case "d_unpay": return confirmBox("Repasser la facture en « à payer » ?",()=>{d.statut="a_payer";d.paye=null;save();render()});
    case "d_stock": return confirmBox("Retirer les pièces du stock ? (camion d'abord, puis dépôt)",()=>stockOut(d));
    case "d_dup": {const c=JSON.parse(JSON.stringify(d)); Object.assign(c,{id:uid(),num:nextNum("D"),date:todayISO(),statut:"brouillon",stockDone:false}); delete c.factureId; delete c.factureNum; S.devis.unshift(c); save(); openDoc("devis",c.id); toast(`Copie créée : ${c.num}`); return}
    case "d_del": return confirmBox(`Supprimer ${F?"la facture":"le devis"} ${d.num} ?`,()=>{
      if(F){S.factures=S.factures.filter(z=>z!==d);const dv=S.devis.find(z=>z.factureId===d.id);if(dv){delete dv.factureId;delete dv.factureNum}}
      else S.devis=S.devis.filter(z=>z!==d);
      edId=null;save();render();toast(F?"Facture supprimée":"Devis supprimé")});
    /* factures et dépenses */
    case "f_mode": fMode=b.dataset.v2; render(); return;
    case "f_fromDevis": {const acc=S.devis.filter(z=>z.statut==="accepte"&&!z.factureId); return sheet(`<h2>Facturer un devis accepté</h2><div class="list">${acc.map(z=>`<div class="row"><button class="main" data-x="f_conv" data-did="${z.id}"><span class="nm">${esc(z.client.nom||"Client")}</span><span class="meta">${esc(z.num)} · ${dfr(z.date)}</span></button><span class="num" style="font-size:18px">${eur(totals(z).ttc)}</span></div>`).join("")}</div><button class="act ghost" data-x="close">Fermer</button>`)}
    case "f_conv": {const z=S.devis.find(v=>v.id===b.dataset.did); close(); if(z) toFacture(z); return}
    case "f_dep": depEd={_new:true,id:uid(),date:todayISO(),cat:"Carburant",lib:"",ttc:"",tva:20}; return depSheet();
    case "f_depEdit": depEd=JSON.parse(JSON.stringify(S.depenses.find(e=>e.id===b.dataset.eid))); return depSheet();
    case "f_cat": grabE(); depEd.cat=b.dataset.v2; depEd.tva=CATS[depEd.cat]; return depSheet();
    case "f_depOk": {grabE(); if(!(depEd.ttc>0)){toast("Indique le montant");return} const {_new,...e}=depEd; if(!e.lib) e.lib=e.cat; if(_new) S.depenses.unshift(e); else S.depenses=S.depenses.map(z=>z.id===e.id?e:z); close(); save(); render(); toast(_new?"Dépense ajoutée":"Dépense modifiée"); return}
    case "f_depDel": {const id=depEd.id; return confirmBox("Supprimer cette dépense ?",()=>{S.depenses=S.depenses.filter(e=>e.id!==id);save();render();toast("Dépense supprimée")})}
    case "f_recvOk": {const n=parseInt($("#qN").value,10)||0, m=num($("#rM").value), p=cur; if(n<=0){toast("Mets une quantité d'au moins 1");return} close(); recv(p,n);
      if(m>0){S.depenses.unshift({id:uid(),date:todayISO(),cat:"Pièces",lib:`${n} × ${p.name}${p.ref?" ("+p.ref+")":""}`,ttc:m,tva:20});save();render();toast(`+${n} ${p.name} · ${eur(m)} ajouté aux dépenses`)} return}
    /* clients */
    case "c_new": cliEdit=null; return clientSheet(null);
    case "c_open": cliId=b.dataset.cid; render(); scrollTo(0,0); return;
    case "c_back": cliId=null; render(); scrollTo(0,0); return;
    case "c_edit": cliEdit=cliById(cliId); return clientSheet(cliEdit);
    case "c_save": {const v=id=>$(id).value.trim(); const nom=v("#kcN"); if(!nom){toast("Donne un nom au client");return}
      const o={nom,adr:$("#kcA").value.trim(),tel:v("#kcT"),mail:v("#kcM"),notes:$("#kcO").value.trim()};
      if(cliEdit) Object.assign(cliEdit,o); else {const c={id:uid(),...o};S.clients.push(c);cliId=c.id}
      close(); save(); render(); toast("Client enregistré"); return}
    case "c_del": {const c=cliEdit; return confirmBox(`Supprimer ${c.nom} ? (ses devis et factures sont gardés)`,()=>{S.clients=S.clients.filter(z=>z!==c);[...S.devis,...S.factures].forEach(z=>{if(z.clientId===c.id)z.clientId=null});cliId=null;save();render();toast("Client supprimé")})}
    case "c_newD": return newDoc("devis",cliById(cliId));
    case "c_newF": return newDoc("facture",cliById(cliId));
    /* catalogue */
    case "d_prestas": return prestas();
    case "d_editT": prEd=JSON.parse(JSON.stringify(S.presta.find(t=>t.id===b.dataset.t))); return editPresta();
    case "d_newT": prEd={_new:true,id:uid(),nom:"",desc:"",h:1,forfait:0,pieces:[]}; return editPresta();
    case "d_tq": {grabT(); const j=+pi.dataset.pi; prEd.pieces[j].q+=num(b.dataset.v2); if(prEd.pieces[j].q<=0) prEd.pieces.splice(j,1); return editPresta()}
    case "d_tAddP": grabT(); return pickPiece(P=>{prEd.pieces.push(P.id?{id:P.id,q:1}:{nom:P.nom,pu:P.pu,q:1}); editPresta()});
    case "d_tSave": {grabT(); if(!prEd.nom){toast("Donne un nom aux travaux");return} const {_new,...o}=prEd; if(_new) S.presta.push(o); else S.presta=S.presta.map(t=>t.id===o.id?o:t); save(); prestas(); toast("Travaux enregistrés"); return}
    case "d_tDel": {const id=prEd.id, nom=prEd.nom; return confirmBox(`Supprimer « ${nom} » de tes travaux ?`,()=>{S.presta=S.presta.filter(t=>t.id!==id);save();toast("Travaux supprimés")})}
    /* réglages */
    case "d_conf": return confSheet();
    case "d_confOk": {const v=id=>$(id).value.trim(); Object.assign(S.conf,{nom:v("#kNom"),adr:$("#kAdr").value.trim(),tel:v("#kTel"),mail:v("#kMail"),siret:v("#kSiret"),taux:num(v("#kTaux")),depl:num(v("#kDepl")),tva:num(v("#kTva")),valid:parseInt(v("#kVal"),10)||30,delai:parseInt(v("#kDelai"),10)||0,ment:$("#kMent").value.trim()}); save(); close(); render(); toast("Réglages enregistrés"); return}
  }
}
let cliEdit=null;
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.id==="pq"){const s=el.value.trim().toLowerCase();document.querySelectorAll("#sh .pk").forEach(r=>r.hidden=!!s&&!r.dataset.txt.includes(s));return}
  if(el.id==="cq"){cq=el.value;const pos=el.selectionStart;render();const i=$("#cq");i.focus();i.setSelectionRange(pos,pos);return}
  if(!el.dataset||!el.dataset.f) return;
  const d=curD(); if(!d) return;
  const f=el.dataset.f;
  if(f.startsWith("client.")) d.client[f.slice(7)]=el.value;
  else if(f==="forfait"){const i=el.dataset.li2,l=d.lignes[+i];l.forfait=num(el.value);$("#st"+i).textContent=eur(lineTotal(d,l))}
  const t=totals(d); $("#tHT").textContent=eur(t.ht); $("#tTVA").textContent=eur(t.tva); $("#tTTC").textContent=eur(t.ttc);
  save();
});

load(); render();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
