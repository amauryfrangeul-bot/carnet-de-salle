<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stock Plomberie</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stock">
<meta name="theme-color" content="#0F2036">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Une colonne, lignes compactes, une grosse action par ligne ; le reste dans une feuille du bas */
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{--bg:#EEF1F4;--card:#fff;--ink:#101826;--mut:#5E6978;--line:#DCE1E7;--soft:#F3F5F8;--sel:#0F2036;--selfg:#fff;--acc:#1F6FD1;--bad:#C0261D;--badbg:#FCE6E4;--ok:#0B6B4D;--disp:"Barlow Condensed",Barlow,system-ui,sans-serif;--body:Barlow,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B121C;--card:#142030;--ink:#EEF2F7;--mut:#94A1B3;--line:#25364B;--soft:#1A2838;--sel:#F5B700;--selfg:#101826;--acc:#6FA8F0;--bad:#FF8A80;--badbg:#3D1614;--ok:#59D3A4;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B121C;--card:#142030;--ink:#EEF2F7;--mut:#94A1B3;--line:#25364B;--soft:#1A2838;--sel:#F5B700;--selfg:#101826;--acc:#6FA8F0;--bad:#FF8A80;--badbg:#3D1614;--ok:#59D3A4;color-scheme:dark}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 var(--body)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
main{max-width:600px;margin:0 auto;padding-block:8px calc(96px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:center;gap:8px;margin:4px 0 10px}
h1{margin:0;flex:1;font:700 36px/1 var(--disp);text-wrap:balance}
.ic{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:22px;font-weight:700;display:grid;place-items:center;padding:0}
.alert{display:block;width:100%;text-align:left;border:0;border-radius:12px;background:var(--badbg);color:var(--bad);font-weight:700;padding:11px 14px;margin-bottom:10px}
.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:10px}
.seg button{border:0;background:none;color:var(--mut);font-weight:700;padding:10px 4px;border-radius:9px}
.seg .on{background:var(--sel);color:var(--selfg)}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.grp{font:700 15px/1 var(--disp);text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:16px 4px 6px}
.row{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 0;border-top:1px solid var(--line);min-height:62px}
.list .row:first-child{border-top:0}
.row .main{flex:1;min-width:0;border:0;background:none;text-align:left;padding:4px 0 4px 14px}
.row.low .main{box-shadow:inset 4px 0 0 var(--bad)}
.nm{display:block;font-weight:600;line-height:1.25}
.meta{display:block;color:var(--mut);font-size:14px;font-variant-numeric:tabular-nums}
.meta .lo{color:var(--bad);font-weight:700}
.big{flex:none;min-width:64px;height:48px;border-radius:12px;border:0;background:var(--sel);color:var(--selfg);font:700 22px/1 var(--disp);padding:0 12px;display:grid;place-items:center;text-decoration:none}
.big.alt{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.big.acc{background:var(--acc);color:#fff;font-size:18px}
.num{flex:none;min-width:52px;text-align:right;font:700 30px/1 var(--disp);font-variant-numeric:tabular-nums;padding-right:4px}
.num.lo{color:var(--bad)}
.empty{text-align:center;color:var(--mut);padding:28px 12px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav button{border:0;background:none;color:var(--mut);font-weight:700;font-size:14px;padding:6px 2px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav svg{width:26px;height:26px}
nav .on{color:var(--ink);background:var(--soft)}
.dot{position:absolute;top:2px;left:calc(50% + 6px);background:var(--bad);color:#fff;font-size:11px;min-width:18px;height:18px;line-height:18px;border-radius:9px;padding:0 4px;font-style:normal}
dialog{border:0;padding:0;margin:auto auto 0;width:100%;max-width:600px;max-height:88vh;border-radius:18px 18px 0 0;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.sh{padding:18px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px}
.sh h2{margin:0;font:700 28px/1.05 var(--disp);text-wrap:balance}
.sub{margin:0;color:var(--mut);font-size:15px}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.nums div{background:var(--soft);border-radius:10px;padding:8px 10px}
.nums small{display:block;color:var(--mut);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.nums b{font:700 28px/1 var(--disp)}
.nums b.lo{color:var(--bad)}
.acts{display:flex;flex-direction:column;gap:8px}
.act{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:13px 14px;font-weight:600;text-decoration:none;color:var(--ink)}
.act.pri{background:var(--sel);color:var(--selfg);border-color:var(--sel);text-align:center}
.act.acc{background:var(--acc);color:#fff;border-color:var(--acc);text-align:center}
.act.danger{color:var(--bad)}
.act.ghost{border:0;background:none;text-align:center;color:var(--mut)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.step{display:grid;grid-template-columns:64px 1fr 64px;gap:8px}
.step button{height:60px;border-radius:12px;border:1px solid var(--line);background:var(--soft);font:700 30px/1 var(--disp)}
.step input{height:60px;text-align:center;font:700 34px/1 var(--disp);border:1px solid var(--line);border-radius:12px;background:var(--bg);min-width:0}
label{font-size:14px;font-weight:600;color:var(--mut);display:block;margin-bottom:4px}
.fld input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
textarea{width:100%;height:200px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:13px/1.4 ui-monospace,Menlo,monospace}
.log{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.log span{color:var(--mut);font-size:13px;flex:none}
.loglist{max-height:55vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:10;display:flex;align-items:center;gap:12px;background:var(--sel);color:var(--selfg);padding:10px 12px 10px 16px;border-radius:12px;font-weight:600;max-width:calc(100vw - 32px);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1;pointer-events:auto}
.toast button{border:0;background:none;color:inherit;font-weight:700;text-decoration:underline;padding:4px}
.toast button[hidden]{display:none}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

</head>
<body>
<main>
  <header><h1 id="title">Camion</h1><button class="ic" id="addBtn" aria-label="Ajouter une pièce" hidden>+</button><button class="ic" id="menuBtn" aria-label="Menu">⋯</button></header>
  <button class="alert" id="alert" hidden></button>
  <div id="view"></div>
</main>

<nav id="nav">
  <button data-v="camion"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 6h13v10H1zM14 10h4l4 4v2h-8z"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg>Camion</button>
  <button data-v="boutique"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l1-5h16l1 5M3 9h18v11H3zM9 20v-6h6v6"/></svg>Boutique</button>
  <button data-v="commande"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 4h2l2 11h12l2-8H6"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/></svg>À commander<i class="dot" id="dot" hidden></i></button>
</nav>

<dialog id="dlg"><div class="sh" id="sh"></div></dialog>
<div class="toast" id="toast" role="status"><span id="toastT"></span><button id="undo" hidden>Annuler</button></div>

<script>
const KEY="stock_plombier_v1", SEUIL=3, DEPART=10;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DEFAULTS=[
 ["Raccord laiton mâle/femelle 15/21","Raccords"],["Raccord laiton mâle/femelle 20/27","Raccords"],
 ["Coude cuivre 90° Ø14","Raccords"],["Coude cuivre 90° Ø16","Raccords"],["Té cuivre égal Ø14","Raccords"],
 ["Manchon cuivre Ø16","Raccords"],["Raccord PER à sertir Ø16","Raccords"],["Raccord multicouche Ø16","Raccords"],
 ["Robinet d'arrêt 1/4 de tour 15/21","Robinetterie"],["Vanne à sphère 20/27","Robinetterie"],
 ["Robinet flotteur WC","Robinetterie"],["Mitigeur lavabo","Robinetterie"],
 ["Flexible inox 30 cm 15/21","Flexibles"],["Flexible inox 50 cm 15/21","Flexibles"],
 ["Joint fibre 15/21 (sachet)","Joints"],["Joint fibre 20/27 (sachet)","Joints"],["Joint torique assortiment","Joints"],
 ["Siphon lavabo PVC Ø32","Évacuation"],["Coude PVC 87° Ø40","Évacuation"],["Coude PVC 87° Ø100","Évacuation"],
 ["Mécanisme de chasse WC","Sanitaire"],["Pipe WC coudée","Sanitaire"],
 ["Rouleau téflon","Consommables"],["Pâte à joint (tube)","Consommables"],["Filasse (écheveau)","Consommables"],
 ["Brasure étain (bobine)","Consommables"],["Colle PVC (pot)","Consommables"],["Collier de fixation Ø16","Fixation"]
];

/* ---------- Données ---------- */
let S;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function fresh(){return{items:DEFAULTS.map(([name,cat],i)=>({id:"p"+i,name,cat,ref:"",bou:DEPART,cam:2,seuil:SEUIL,cmd:DEPART-SEUIL,url:""})),log:[]}}
function load(){try{S=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){S=null}if(!S||!Array.isArray(S.items)){S=fresh();save()}S.log=S.log||[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function log(t){S.log.unshift({t:Date.now(),txt:t});S.log=S.log.slice(0,200)}
const byId=id=>S.items.find(p=>p.id===id);
const isLow=p=>p.bou<=p.seuil;
const dispo=p=>p.bou-p.cam;
const orderUrl=p=>p.url||("https://www.google.com/search?tbm=shop&q="+encodeURIComponent(p.name+(p.ref?" "+p.ref:"")+" plomberie"));

/* ---------- Toast + annuler ---------- */
let undoSnap=null;
function toast(msg,undo){
  $("#toastT").textContent=msg; $("#undo").hidden=!undo; undoSnap=undo||null;
  const t=$("#toast"); t.classList.add("show"); clearTimeout(toast.h); toast.h=setTimeout(()=>{t.classList.remove("show");undoSnap=null},undo?5000:2400);
}
$("#undo").onclick=()=>{if(!undoSnap)return;const {id,bou,cam}=undoSnap;const p=byId(id);if(p){p.bou=bou;p.cam=cam;log(`Annulé : ${p.name}`);save();render()}undoSnap=null;$("#toast").classList.remove("show")};
const snap=p=>({id:p.id,bou:p.bou,cam:p.cam});

/* ---------- Mouvements ---------- */
function done(p,msg,u){save();render();toast(isLow(p)?`⚠️ ${p.name} : plus que ${p.bou}, à commander`:msg,u)}
function take(p,n){n=Math.min(n,p.cam);if(n<=0)return toast("Plus de pièce dans le camion");const u=snap(p);p.cam-=n;p.bou-=n;log(`Camion −${n} ${p.name} (boutique ${p.bou})`);done(p,`−${n} ${p.name} · reste ${p.cam} au camion`,u)}
function use(p,n){n=Math.min(n,dispo(p));if(n<=0)return toast("Plus rien au dépôt");const u=snap(p);p.bou-=n;log(`Dépôt −${n} ${p.name} (boutique ${p.bou})`);done(p,`−${n} ${p.name}`,u)}
function loadT(p,n){n=Math.min(n,dispo(p));if(n<=0)return toast("Plus rien au dépôt à charger");const u=snap(p);p.cam+=n;log(`Chargé ${n} ${p.name} dans le camion`);save();render();toast(`+${n} ${p.name} au camion`,u)}
function unload(p,n){n=Math.min(n,p.cam);if(n<=0)return;const u=snap(p);p.cam-=n;log(`Remis ${n} ${p.name} au dépôt`);save();render();toast(`${n} remis au dépôt`,u)}
function recv(p,n){if(n<=0)return;const u=snap(p);p.bou+=n;log(`Réception +${n} ${p.name} (boutique ${p.bou})`);save();render();toast(`+${n} ${p.name} reçu`,u)}

/* ---------- Écrans ---------- */
let view="camion", camMode="in", q="";
const match=p=>{const s=q.trim().toLowerCase();return !s||(p.name+" "+p.ref+" "+p.cat).toLowerCase().includes(s)};
const row=(p,meta,right)=>`<div class="row ${isLow(p)?"low":""}" data-id="${p.id}"><button class="main" data-x="open"><span class="nm">${esc(p.name)}</span><span class="meta">${meta}</span></button>${right}</div>`;
const lo=(p,txt)=>isLow(p)?`<span class="lo">${txt}</span>`:txt;
function grouped(list,fn){
  const g={};list.forEach(p=>(g[p.cat||"Autres"]=g[p.cat||"Autres"]||[]).push(p));
  return Object.keys(g).sort((a,b)=>a.localeCompare(b,"fr")).map(c=>`<div class="grp">${esc(c)}</div><div class="list">${g[c].map(fn).join("")}</div>`).join("");
}
const searchBox=()=>`<input class="search" id="q" type="search" placeholder="Rechercher une pièce…" value="${esc(q)}" autocomplete="off">`;

function render(){
  const low=S.items.filter(isLow);
  $("#dot").hidden=!low.length; $("#dot").textContent=low.length;
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===view));
  $("#addBtn").hidden=view!=="boutique";
  const al=$("#alert"); al.hidden=!low.length||view==="commande";
  al.textContent=`⚠️ ${low.length} pièce${low.length>1?"s":""} à commander →`;
  const V=$("#view");

  if(view==="camion"){
    $("#title").textContent="Camion";
    const inT=S.items.filter(p=>p.cam>0);
    const seg=`<div class="seg"><button data-m="in" class="${camMode==="in"?"on":""}">Dans le camion</button><button data-m="load" class="${camMode==="load"?"on":""}">+ Charger</button></div>`;
    if(camMode==="in"){
      const L=inT.filter(match);
      V.innerHTML=seg+searchBox()+(L.length?grouped(L,p=>row(p,`Camion ${p.cam} · ${lo(p,"Boutique "+p.bou)}`,`<button class="big" data-x="take" aria-label="Prendre 1 ${esc(p.name)}">−1</button>`))
        :`<div class="empty">${q?"Aucune pièce trouvée.":"Le camion est vide.<br>Appuie sur « + Charger »."}</div>`);
    }else{
      const L=S.items.filter(p=>dispo(p)>0).filter(match);
      V.innerHTML=seg+searchBox()+(L.length?grouped(L,p=>row(p,`Au dépôt ${dispo(p)} · Camion ${p.cam}`,`<button class="big alt" data-x="load1" aria-label="Charger 1 ${esc(p.name)}">+1</button>`))
        :`<div class="empty">${q?"Aucune pièce trouvée.":"Plus rien au dépôt à charger."}</div>`);
    }
  }
  else if(view==="boutique"){
    $("#title").textContent="Boutique";
    const L=S.items.filter(match);
    V.innerHTML=searchBox()+(L.length?grouped(L,p=>row(p,`${p.ref?esc(p.ref)+" · ":""}dont ${p.cam} au camion`,`<div class="num ${isLow(p)?"lo":""}">${p.bou}</div>`))
      :'<div class="empty">Aucune pièce trouvée.</div>');
  }
  else{
    $("#title").textContent="À commander";
    V.innerHTML=low.length
      ?`<div class="list">${low.sort((a,b)=>a.bou-b.bou).map(p=>row(p,`Reste <span class="lo">${p.bou}</span> · commander ${p.cmd}`,`<a class="big acc" href="${esc(orderUrl(p))}" target="_blank" rel="noopener">Commander</a>`)).join("")}</div>
        <div class="acts" style="margin-top:12px"><button class="act" data-x="share">Copier la liste pour le fournisseur</button></div>
        <p class="sub" style="margin-top:10px">Appuie sur une pièce quand la commande arrive pour la marquer reçue.</p>`
      :'<div class="empty">Rien à commander. Tout est au-dessus du seuil.</div>';
  }
}

/* ---------- Feuille du bas ---------- */
let cur=null, qtyFn=null;
const dlg=$("#dlg");
function sheet(html){$("#sh").innerHTML=html;if(!dlg.open)dlg.showModal();$("#sh").scrollTop=0}
const close=()=>dlg.close();
dlg.addEventListener("click",e=>{if(e.target===dlg)close()});

function openItem(p){
  cur=p;
  const a=[];
  if(p.cam>0) a.push(`<button class="act" data-x="takeN">Prendre dans le camion…</button>`);
  if(dispo(p)>0) a.push(`<button class="act" data-x="loadN">Charger dans le camion…</button>`);
  if(dispo(p)>0) a.push(`<button class="act" data-x="useN">Utiliser au dépôt…</button>`);
  if(p.cam>0) a.push(`<button class="act" data-x="unloadN">Remettre au dépôt…</button>`);
  a.push(`<button class="act" data-x="recvN">Commande reçue…</button>`);
  sheet(`<h2>${esc(p.name)}</h2>${p.ref||p.cat?`<p class="sub">${esc([p.ref,p.cat].filter(Boolean).join(" · "))}</p>`:""}
    <div class="nums"><div><small>Boutique</small><b class="${isLow(p)?"lo":""}">${p.bou}</b></div><div><small>Camion</small><b>${p.cam}</b></div><div><small>Seuil</small><b>${p.seuil}</b></div></div>
    <a class="act acc" href="${esc(orderUrl(p))}" target="_blank" rel="noopener">Commander ↗</a>
    <div class="acts">${a.join("")}<button class="act" data-x="edit">Modifier la fiche</button></div>
    <button class="act ghost" data-x="close">Fermer</button>`);
}
function askQty(title,sub,def,fn){
  qtyFn=fn;
  sheet(`<h2>${esc(title)}</h2><p class="sub">${esc(sub)}</p>
    <div class="step"><button data-x="minus" aria-label="Moins">−</button><input id="qN" type="number" min="1" inputmode="numeric" value="${def}"><button data-x="plus" aria-label="Plus">+</button></div>
    <div class="two"><button class="act ghost" data-x="close">Annuler</button><button class="act pri" data-x="qok">Valider</button></div>`);
}
function confirmBox(msg,fn){qtyFn=fn;sheet(`<h2>${esc(msg)}</h2><div class="two"><button class="act" data-x="close">Annuler</button><button class="act pri" data-x="cok" style="background:var(--bad);border-color:var(--bad);color:#fff">Confirmer</button></div>`)}
function textBox(title,sub,txt){sheet(`<h2>${esc(title)}</h2><p class="sub">${esc(sub)}</p><textarea id="tX" readonly>${esc(txt)}</textarea><div class="two"><button class="act" data-x="copy">Copier</button><button class="act pri" data-x="close">Fermer</button></div>`)}
function editItem(p){
  cur=p||null;
  const f=(id,lab,val,type="text",extra="")=>`<div class="fld"><label for="${id}">${lab}</label><input id="${id}" type="${type}" value="${esc(val)}" ${extra}></div>`;
  sheet(`<h2>${p?"Modifier la pièce":"Nouvelle pièce"}</h2>
    ${f("fName","Nom de la pièce",p?p.name:"","text",'placeholder="ex : Raccord laiton 15/21"')}
    <div class="two">${f("fRef","Référence",p?p.ref:"")}${f("fCat","Catégorie",p?p.cat:"","text",'list="cats"')}</div>
    <datalist id="cats">${[...new Set(S.items.map(x=>x.cat).filter(Boolean))].map(c=>`<option value="${esc(c)}">`).join("")}</datalist>
    <div class="two">${f("fBou","Stock boutique",p?p.bou:DEPART,"number",'min="0" inputmode="numeric"')}${f("fCam","Dont au camion",p?p.cam:0,"number",'min="0" inputmode="numeric"')}</div>
    <div class="two">${f("fSeuil","Seuil d'alerte",p?p.seuil:SEUIL,"number",'min="0" inputmode="numeric"')}${f("fCmd","Qté à commander",p?p.cmd:DEPART-SEUIL,"number",'min="1" inputmode="numeric"')}</div>
    ${f("fUrl","Lien du produit chez le fournisseur",p?p.url:"","url",'placeholder="https://…"')}
    <div class="two"><button class="act ghost" data-x="close">Annuler</button><button class="act pri" data-x="saveItem">Enregistrer</button></div>
    ${p?'<button class="act danger" data-x="del">Supprimer la pièce</button>':""}`);
}
function menu(){
  sheet(`<h2>Menu</h2><div class="acts">
    <button class="act" data-x="hist">Historique des mouvements</button>
    <button class="act" data-x="new">Ajouter une pièce</button>
    <button class="act" data-x="exp">Sauvegarder mes données</button>
    <button class="act" data-x="imp">Restaurer une sauvegarde</button>
    <button class="act danger" data-x="reset">Tout remettre à zéro</button></div>
    <button class="act ghost" data-x="close">Fermer</button>`);
}
function hist(){
  sheet(`<h2>Historique</h2><div class="loglist">${S.log.length?S.log.map(l=>`<div class="log"><div>${esc(l.txt)}</div><span>${new Date(l.t).toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}</span></div>`).join(""):'<p class="sub">Aucun mouvement pour l\'instant.</p>'}</div><button class="act pri" data-x="close">Fermer</button>`);
}
function saveItem(){
  const v=id=>$(id).value.trim(), n=(id,d)=>{const x=parseInt($(id).value,10);return isNaN(x)||x<0?d:x};
  const name=v("#fName"); if(!name){toast("Donne un nom à la pièce");$("#fName").focus();return}
  const d={name,ref:v("#fRef"),cat:v("#fCat"),bou:n("#fBou",DEPART),seuil:n("#fSeuil",SEUIL),cmd:Math.max(1,n("#fCmd",DEPART-SEUIL)),url:v("#fUrl")};
  d.cam=Math.min(n("#fCam",0),d.bou);
  if(d.url&&!/^https?:\/\//i.test(d.url))d.url="https://"+d.url;
  if(cur){Object.assign(cur,d);log(`Fiche modifiée : ${name}`)}else{S.items.push({id:uid(),...d});log(`Nouvelle pièce : ${name} (${d.bou})`)}
  save();close();render();toast("Pièce enregistrée");
}
function copyText(txt){
  const sel=()=>{const t=$("#tX");if(t){t.focus();t.select()}toast("Texte sélectionné, fais Copier")};
  try{navigator.clipboard.writeText(txt).then(()=>toast("Copié"),sel)}catch(e){sel()}
}

/* ---------- Clics ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-x],[data-m],nav button"); if(!b) return;
  if(b.dataset.v){view=b.dataset.v;q="";camMode="in";render();scrollTo(0,0);return}
  if(b.dataset.m){camMode=b.dataset.m;render();return}
  const host=b.closest("[data-id]"), p=host?byId(host.dataset.id):cur;
  const nv=()=>parseInt($("#qN").value,10)||0;
  switch(b.dataset.x){
    case "open": return camMode==="load"&&view==="camion"?askQty("Charger dans le camion",`${p.name} · ${dispo(p)} au dépôt`,Math.min(2,dispo(p)),n=>loadT(p,n)):openItem(p);
    case "take": return take(p,1);
    case "load1": return loadT(p,1);
    case "takeN": return askQty("Prendre dans le camion",`${p.name} · ${p.cam} au camion`,1,n=>take(p,n));
    case "loadN": return askQty("Charger dans le camion",`${p.name} · ${dispo(p)} au dépôt`,Math.min(2,dispo(p)),n=>loadT(p,n));
    case "useN": return askQty("Utiliser au dépôt",`${p.name} · ${dispo(p)} au dépôt`,1,n=>use(p,n));
    case "unloadN": return askQty("Remettre au dépôt",`${p.name} · ${p.cam} au camion`,p.cam,n=>unload(p,n));
    case "recvN": return askQty("Commande reçue",`${p.name} · stock actuel ${p.bou}`,p.cmd,n=>recv(p,n));
    case "minus": $("#qN").value=Math.max(1,nv()-1); return;
    case "plus": $("#qN").value=nv()+1; return;
    case "qok": {const n=nv(),f=qtyFn;qtyFn=null;close();if(n>0&&f)f(n);else toast("Mets une quantité d'au moins 1");return}
    case "cok": {const f=qtyFn;qtyFn=null;close();if(f)f();return}
    case "edit": return editItem(p);
    case "new": return editItem(null);
    case "saveItem": return saveItem();
    case "del": {const it=cur;return confirmBox(`Supprimer « ${it.name} » ?`,()=>{S.items=S.items.filter(x=>x!==it);log(`Pièce supprimée : ${it.name}`);save();render();toast("Pièce supprimée")})}
    case "share": {const low=S.items.filter(isLow);return textBox("Liste de commande","Copie-la puis colle-la dans un SMS ou un mail.","Commande plomberie :\n"+low.map(x=>`- ${x.cmd} × ${x.name}${x.ref?" ("+x.ref+")":""}${x.url?" : "+x.url:""}`).join("\n"))}
    case "copy": return copyText($("#tX").value);
    case "hist": return hist();
    case "exp": return textBox("Sauvegarde","Copie ce texte et garde-le dans tes notes ou un mail. Pour restaurer, mets-le dans un fichier .json.",JSON.stringify(S));
    case "imp": {close();const i=document.createElement("input");i.type="file";i.accept="application/json,.json,.txt";i.onchange=()=>{const f=i.files[0];if(!f)return;f.text().then(t=>{const d=JSON.parse(t);if(!Array.isArray(d.items))throw 0;S={items:d.items,log:d.log||[]};save();render();toast("Sauvegarde restaurée")}).catch(()=>toast("Fichier invalide : ce n'est pas une sauvegarde du stock"))};i.click();return}
    case "reset": return confirmBox("Tout remettre à zéro ?",()=>{S=fresh();save();render();toast("Stock remis à zéro")});
    case "close": return close();
  }
});
$("#menuBtn").onclick=menu;
$("#addBtn").onclick=()=>editItem(null);
$("#alert").onclick=()=>{view="commande";render();scrollTo(0,0)};
$("#view").addEventListener("input",e=>{if(e.target.id!=="q")return;q=e.target.value;const pos=e.target.selectionStart;render();const i=$("#q");i.focus();i.setSelectionRange(pos,pos)});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&dlg.open){const ok=$("#sh [data-x=qok],#sh [data-x=saveItem]");if(ok&&e.target.tagName==="INPUT"){e.preventDefault();ok.click()}}});

load(); render();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body></html>
