<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stock Plomberie</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stock">
<meta name="theme-color" content="#0F2036">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{--bg:#E8EBEF;--card:#fff;--ink:#101826;--mut:#5B6675;--line:#D3D9E0;--warm:#F3F5F8;--sel:#0F2036;--selfg:#fff;--acc:#1F6FD1;--accbg:#E3EEFB;--ok:#0B6B4D;--okbg:#DDF3E9;--warn:#A15C00;--warnbg:#FDF0D8;--bad:#B3261E;--badbg:#FBE3E1;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B121C;--card:#142030;--ink:#EEF2F7;--mut:#94A1B3;--line:#25364B;--warm:#0F1926;--sel:#F5B700;--selfg:#101826;--acc:#6FA8F0;--accbg:#13294A;--ok:#59D3A4;--okbg:#12372D;--warn:#F5B700;--warnbg:#3A2D0A;--bad:#FF8A80;--badbg:#3D1614;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B121C;--card:#142030;--ink:#EEF2F7;--mut:#94A1B3;--line:#25364B;--warm:#0F1926;--sel:#F5B700;--selfg:#101826;--acc:#6FA8F0;--accbg:#13294A;--ok:#59D3A4;--okbg:#12372D;--warn:#F5B700;--warnbg:#3A2D0A;--bad:#FF8A80;--badbg:#3D1614;color-scheme:dark}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Barlow,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
main{max-width:600px;margin:0 auto;padding-block:10px calc(110px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
textarea{width:100%;height:220px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:13px/1.4 ui-monospace,Menlo,monospace}
button,input,select{font-family:inherit;font-size:16px}
button{cursor:pointer}
h1{margin:6px 0 2px;font:700 40px/1 "Barlow Condensed",Barlow,sans-serif}
.sub{margin:0 0 12px;color:var(--mut)}
.alert{display:flex;gap:10px;align-items:center;background:var(--badbg);color:var(--bad);border-radius:12px;padding:10px 12px;font-weight:600;margin-bottom:12px;border:0;width:100%;text-align:left}
.alert[hidden]{display:none}
.tools{display:flex;gap:8px;margin-bottom:10px}
.tools input{flex:1;min-width:0;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:600;padding:10px 14px;border-radius:12px;white-space:nowrap}
.btn.pri{background:var(--sel);color:var(--selfg);border-color:var(--sel)}
.btn.acc{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.sm{padding:7px 11px;font-size:15px;border-radius:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:500;font-size:15px;padding:7px 13px;border-radius:999px}
.chips .on{background:var(--sel);color:var(--selfg);border-color:var(--sel)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.card.low{border-color:var(--bad);box-shadow:inset 4px 0 0 var(--bad)}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.name{font-weight:700;font-size:17px;line-height:1.25}
.ref{color:var(--mut);font-size:14px}
.badge{flex:none;font-size:13px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--okbg);color:var(--ok)}
.badge.low{background:var(--badbg);color:var(--bad)}
.badge.mid{background:var(--warnbg);color:var(--warn)}
.qty{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.q{background:var(--warm);border-radius:10px;padding:8px 10px}
.q small{display:block;color:var(--mut);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.q b{font:700 30px/1 "Barlow Condensed",Barlow,sans-serif}
.q b.low{color:var(--bad)}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.acts .sp{flex:1}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:repeat(4,1fr);gap:4px;z-index:5}
nav button{border:0;background:none;color:var(--mut);font-weight:600;font-size:14px;padding:6px 2px;border-radius:10px;position:relative;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:24px;height:24px}
nav .on{color:var(--ink);background:var(--warm)}
nav .dot{position:absolute;top:2px;right:calc(50% - 22px);background:var(--bad);color:#fff;font-size:11px;min-width:18px;height:18px;line-height:18px;border-radius:9px;padding:0 4px}
nav .dot[hidden]{display:none}
dialog{border:0;border-radius:16px;padding:0;width:min(520px,calc(100vw - 24px));background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog form{padding:16px}
dialog h2{margin:0 0 12px;font:700 26px/1.1 "Barlow Condensed",Barlow,sans-serif}
label{display:block;font-size:14px;font-weight:600;color:var(--mut);margin:10px 0 4px}
dialog input,dialog select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.foot .del{margin-right:auto;color:var(--bad)}
.hint{font-size:13px;color:var(--mut);margin-top:4px}
.log{font-size:15px;border-bottom:1px solid var(--line);padding:8px 0;display:flex;justify-content:space-between;gap:10px}
.log span{color:var(--mut);font-size:13px;flex:none}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--sel);color:var(--selfg);padding:10px 16px;border-radius:12px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:10;max-width:calc(100vw - 32px)}
.toast.show{opacity:1}
.step{display:grid;grid-template-columns:56px 1fr 56px;gap:8px}.step .btn{font-size:22px;padding:6px 0}.step input{text-align:center;font-size:22px;font-weight:700}
.lr{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}.lr .nm{flex:1;min-width:0}.lr .nm small{display:block;color:var(--mut);font-size:13px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:10px}.seg button{border:0;background:none;color:var(--mut);font-weight:600;padding:9px;border-radius:9px}.seg .on{background:var(--sel);color:var(--selfg)}
.sec{font:700 20px/1.2 "Barlow Condensed",Barlow,sans-serif;margin:18px 0 8px;text-transform:uppercase;letter-spacing:.03em;color:var(--mut)}
</style></head>
<body>
<main>
  <h1 id="title">Boutique</h1>
  <p class="sub" id="subtitle"></p>
  <button class="alert" id="alert" hidden></button>
  <div id="view"></div>
</main>

<nav id="nav">
  <button data-v="boutique" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l1-5h16l1 5M3 9h18v11H3zM9 20v-6h6v6"/></svg>Boutique</button>
  <button data-v="camion"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 6h13v10H1zM14 10h4l4 4v2h-8z"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg>Camion</button>
  <button data-v="commande"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 4h2l2 11h12l2-8H6"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/></svg>À commander<i class="dot" id="dot" hidden></i></button>
  <button data-v="historique"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Historique</button>
</nav>

<dialog id="dlg"><form id="frm">
  <h2 id="dlgT">Nouvelle pièce</h2>
  <label for="fName">Nom de la pièce</label>
  <input id="fName" required placeholder="ex : Raccord laiton 15/21">
  <div class="row2">
    <div><label for="fRef">Référence</label><input id="fRef" placeholder="ex : RL1521"></div>
    <div><label for="fCat">Catégorie</label><input id="fCat" list="cats" placeholder="ex : Raccords"></div>
  </div>
  <datalist id="cats"></datalist>
  <div class="row2">
    <div><label for="fBou">Stock boutique</label><input id="fBou" type="number" min="0" inputmode="numeric" value="10"></div>
    <div><label for="fCam">Dont dans le camion</label><input id="fCam" type="number" min="0" inputmode="numeric" value="0"></div>
  </div>
  <div class="row2">
    <div><label for="fSeuil">Seuil d'alerte</label><input id="fSeuil" type="number" min="0" inputmode="numeric" value="3"></div>
    <div><label for="fCmd">Qté à commander</label><input id="fCmd" type="number" min="1" inputmode="numeric" value="7"></div>
  </div>
  <label for="fUrl">Lien vers le produit (fournisseur)</label>
  <input id="fUrl" type="url" placeholder="https://… (colle le lien de la page produit)">
  <div class="hint">Sans lien, le bouton « Commander » lance une recherche du produit.</div>
  <div class="foot">
    <button type="button" class="btn del" id="fDel">Supprimer</button>
    <button type="button" class="btn" id="fCancel">Annuler</button>
    <button type="button" class="btn pri" id="fOk">Enregistrer</button>
  </div>
</form></dialog>

<dialog id="qdlg"><form id="qfrm">
  <h2 id="qT"></h2>
  <p class="sub" id="qS"></p>
  <label for="qN">Quantité</label>
  <div class="step"><button type="button" class="btn" id="qMinus" aria-label="Moins">−</button><input id="qN" type="number" min="1" inputmode="numeric" value="1"><button type="button" class="btn" id="qPlus" aria-label="Plus">+</button></div>
  <div class="foot">
    <button type="button" class="btn" id="qCancel">Annuler</button>
    <button type="button" class="btn pri" id="qOk">Valider</button>
  </div>
</form></dialog>

<dialog id="cdlg"><form id="cfrm">
  <h2 id="cT"></h2>
  <div class="foot"><button type="button" class="btn" id="cNo">Annuler</button><button type="button" class="btn pri" id="cYes" style="background:var(--bad);border-color:var(--bad);color:#fff">Confirmer</button></div>
</form></dialog>
<dialog id="tdlg"><form id="tfrm">
  <h2 id="tT"></h2>
  <p class="sub" id="tS"></p>
  <textarea id="tX" readonly></textarea>
  <div class="foot"><button type="button" class="btn" id="tCopy">Copier</button><button type="button" class="btn pri" id="tClose">Fermer</button></div>
</form></dialog>
<div class="toast" id="toast"></div>

<script>
const KEY="stock_plombier_v1";
const SEUIL=3, DEPART=10;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const DEFAULTS=[
 ["Raccord laiton mâle/femelle 15/21","Raccords"],["Raccord laiton mâle/femelle 20/27","Raccords"],
 ["Coude cuivre 90° Ø14","Raccords"],["Coude cuivre 90° Ø16","Raccords"],["Té cuivre égal Ø14","Raccords"],
 ["Manchon cuivre Ø16","Raccords"],["Raccord PER à sertir Ø16","Raccords"],["Raccord multicouche Ø16","Raccords"],
 ["Robinet d'arrêt 1/4 de tour 15/21","Robinetterie"],["Vanne à sphère 20/27","Robinetterie"],
 ["Robinet flotteur WC","Robinetterie"],["Mitigeur lavabo","Robinetterie"],
 ["Flexible inox 30 cm 15/21","Flexibles"],["Flexible inox 50 cm 15/21","Flexibles"],
 ["Joint fibre 15/21 (sachet)","Joints"],["Joint fibre 20/27 (sachet)","Joints"],["Joint torique assortiment","Joints"],
 ["Siphon lavabo PVC Ø32","Évacuation"],["Coude PVC 87° Ø40","Évacuation"],["Coude PVC 87° Ø100","Évacuation"],
 ["Mécanisme de chasse WC","Sanitaire"],["Pipe WC coudée","Sanitaire"],
 ["Rouleau téflon","Consommables"],["Pâte à joint (tube)","Consommables"],["Filasse (écheveau)","Consommables"],
 ["Brasure étain (bobine)","Consommables"],["Colle PVC (pot)","Consommables"],["Collier de fixation Ø16","Fixation"]
];

let S;
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function load(){
  try{S=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){S=null}
  if(!S||!Array.isArray(S.items)){
    S={items:DEFAULTS.map(([name,cat],i)=>({id:"p"+i,name,cat,ref:"",bou:DEPART,cam:2,seuil:SEUIL,cmd:DEPART-SEUIL,url:""})),log:[]};
    save();
  }
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function log(txt){S.log.unshift({t:Date.now(),txt});S.log=S.log.slice(0,200)}
const isLow=p=>p.bou<=p.seuil;
const orderUrl=p=>p.url||("https://www.google.com/search?tbm=shop&q="+encodeURIComponent(p.name+(p.ref?" "+p.ref:"")+" plomberie"));
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("show"),2400)}

let cFn=null;
function ask(msg,fn){$("#cT").textContent=msg;cFn=fn;$("#cdlg").showModal()}
$("#cNo").onclick=()=>{cFn=null;$("#cdlg").close()};
$("#cYes").onclick=()=>{const f=cFn;cFn=null;$("#cdlg").close();if(f)f()};
$("#tClose").onclick=()=>$("#tdlg").close();
document.querySelectorAll("dialog form").forEach(f=>f.addEventListener("submit",e=>{e.preventDefault();const ok=f.querySelector(".btn.pri[id]");if(ok&&ok.id!=="tClose")ok.click()}));
function showText(title,sub,txt){$("#tT").textContent=title;$("#tS").textContent=sub;$("#tX").value=txt;$("#tdlg").showModal()}
$("#tCopy").onclick=()=>{const x=$("#tX");const sel=()=>{x.focus();x.select();toast("Texte sélectionné : fais Copier")};
  try{navigator.clipboard.writeText(x.value).then(()=>toast("Copié ✓"),sel)}catch(e){sel()}};
let view="boutique", q="", cat="", camMode="in";

function badge(p){
  if(p.bou===0) return '<span class="badge low">Rupture</span>';
  if(isLow(p)) return '<span class="badge low">À commander</span>';
  if(p.bou<=p.seuil+2) return '<span class="badge mid">Bientôt bas</span>';
  return '<span class="badge">OK</span>';
}
function head(p){
  return `<div class="top"><div><div class="name">${esc(p.name)}</div><div class="ref">${esc([p.ref,p.cat].filter(Boolean).join(" · "))}</div></div>${badge(p)}</div>`;
}
function qtys(p){
  return `<div class="qty"><div class="q"><small>Boutique</small><b class="${isLow(p)?"low":""}">${p.bou}</b></div><div class="q"><small>Camion</small><b>${p.cam}</b></div></div>`;
}
const cmdBtn=p=>`<a class="btn sm acc" href="${esc(orderUrl(p))}" target="_blank" rel="noopener">Commander ↗</a>`;

function filtered(list){
  const s=q.trim().toLowerCase();
  return list.filter(p=>(!cat||p.cat===cat)&&(!s||(p.name+" "+p.ref+" "+p.cat).toLowerCase().includes(s)));
}
function toolsHtml(withAdd){
  const cats=[...new Set(S.items.map(p=>p.cat).filter(Boolean))].sort();
  return `<div class="tools"><input id="q" type="search" placeholder="Rechercher une pièce…" value="${esc(q)}">${withAdd?'<button class="btn pri" id="add">+ Pièce</button>':""}</div>
  <div class="chips"><button data-c="" class="${cat?"":"on"}">Tout</button>${cats.map(c=>`<button data-c="${esc(c)}" class="${c===cat?"on":""}">${esc(c)}</button>`).join("")}</div>`;
}

function render(){
  const low=S.items.filter(isLow);
  $("#dot").hidden=!low.length; $("#dot").textContent=low.length;
  const al=$("#alert");
  al.hidden=!low.length||view==="commande";
  al.innerHTML=`⚠️ ${low.length} pièce${low.length>1?"s":""} à ${SEUIL} ou moins — à commander →`;
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===view));
  const V=$("#view");
  const totB=S.items.reduce((a,p)=>a+p.bou,0), totC=S.items.reduce((a,p)=>a+p.cam,0);

  if(view==="boutique"){
    $("#title").textContent="Boutique";
    $("#subtitle").textContent=`${S.items.length} références · ${totB} pièces en stock (dont ${totC} dans le camion)`;
    const L=filtered(S.items);
    V.innerHTML=toolsHtml(true)+(L.length?L.map(p=>`<div class="card ${isLow(p)?"low":""}" data-id="${p.id}">${head(p)}${qtys(p)}
      <div class="acts">
        <button class="btn sm" data-a="use">− Utiliser</button>
        <button class="btn sm" data-a="load">→ Camion</button>
        <button class="btn sm" data-a="recv">+ Réception</button>
        <span class="sp"></span>
        ${isLow(p)?cmdBtn(p):""}
        <button class="btn sm" data-a="edit">Modifier</button>
      </div></div>`).join(""):'<div class="empty">Aucune pièce trouvée.</div>');
  }
  else if(view==="camion"){
    $("#title").textContent="Camion";
    $("#subtitle").textContent=`${totC} pièces chargées · chaque pièce prise ici baisse aussi le stock boutique`;
    const L=filtered(S.items.filter(p=>p.cam>0));
    const rest=S.items.filter(p=>p.cam===0&&p.bou>0).length;
    const dep=filtered(S.items.filter(p=>p.bou-p.cam>0));
    const seg=`<div class="seg"><button data-m="in" class="${camMode==="in"?"on":""}">Dans le camion (${totC})</button><button data-m="load" class="${camMode==="load"?"on":""}">+ Charger le camion</button></div>`;
    if(camMode==="load"){
      V.innerHTML=seg+toolsHtml(false)
      +(rest?`<button class="btn" id="loadAll" style="margin-bottom:6px;width:100%">Charger 2 de chaque pièce absente du camion (${rest})</button>`:"")
      +(dep.length?dep.map(p=>`<div class="lr" data-id="${p.id}"><div class="nm">${esc(p.name)}<small>Au dépôt : ${p.bou-p.cam} · Camion : ${p.cam}</small></div><button class="btn sm pri" data-a="load1">+1</button><button class="btn sm" data-a="load">+…</button></div>`).join(""):'<div class="empty">Plus rien au dépôt à charger.</div>');
      return;
    }
    V.innerHTML=seg+toolsHtml(false)+(L.length?L.map(p=>`<div class="card ${isLow(p)?"low":""}" data-id="${p.id}">${head(p)}${qtys(p)}
      <div class="acts">
        <button class="btn sm pri" data-a="take">− Prendre 1</button>
        <button class="btn sm" data-a="takeN">Prendre…</button>
        <button class="btn sm" data-a="unload">← Décharger</button>
        <span class="sp"></span>
        ${isLow(p)?cmdBtn(p):""}
      </div></div>`).join(""):`<div class="empty">Le camion est vide${q||cat?" pour ce filtre":""}.<br>Appuie sur « + Charger le camion » en haut.</div>`);
  }
  else if(view==="commande"){
    $("#title").textContent="À commander";
    $("#subtitle").textContent=low.length?`${low.length} pièce${low.length>1?"s":""} au seuil d'alerte ou en dessous`:"Rien à commander, tout est au-dessus du seuil 👍";
    V.innerHTML=(low.length?`<div class="tools"><button class="btn" id="share">📋 Copier / partager la liste</button></div>`:"")+
      low.sort((a,b)=>a.bou-b.bou).map(p=>`<div class="card low" data-id="${p.id}">${head(p)}
      <div class="qty"><div class="q"><small>En stock</small><b class="low">${p.bou}</b></div><div class="q"><small>À commander</small><b>${p.cmd}</b></div></div>
      <div class="acts">
        ${cmdBtn(p).replace("btn sm acc","btn acc")}
        <button class="btn" data-a="recv">✓ Reçu</button>
        <span class="sp"></span>
        <button class="btn sm" data-a="edit">${p.url?"Modifier":"Ajouter le lien"}</button>
      </div></div>`).join("");
  }
  else{
    $("#title").textContent="Historique";
    $("#subtitle").textContent="Derniers mouvements de stock";
    V.innerHTML=(S.log.length?S.log.map(l=>`<div class="log"><div>${esc(l.txt)}</div><span>${new Date(l.t).toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}</span></div>`).join(""):'<div class="empty">Aucun mouvement pour l\'instant.</div>')
      +`<div class="sec">Sauvegarde</div><div class="acts"><button class="btn" id="exp">Exporter</button><button class="btn" id="imp">Importer</button><button class="btn" id="reset" style="color:var(--bad)">Réinitialiser</button></div>
      <div class="hint">Les données sont enregistrées sur ce téléphone. Exporte-les de temps en temps pour ne rien perdre.</div>`;
  }
}

/* --- Mouvements de stock --- */
const byId=id=>S.items.find(p=>p.id===id);
function afterMove(p,msg){
  save();render();
  if(isLow(p)) toast(`⚠️ ${p.name} : plus que ${p.bou} — pense à commander`); else if(msg) toast(msg);
}
function takeFromTruck(p,n){            // prendre dans le camion => baisse camion ET boutique
  n=Math.min(n,p.cam); if(n<=0) return toast("Plus de pièce dans le camion");
  p.cam-=n; p.bou-=n; log(`Camion : −${n} ${p.name} (boutique ${p.bou})`); afterMove(p,`−${n} ${p.name}`);
}
function useFromShop(p,n){              // utiliser directement au dépôt
  const dispo=p.bou-p.cam; n=Math.min(n,dispo); if(n<=0) return toast("Plus de pièce au dépôt (le reste est dans le camion)");
  p.bou-=n; log(`Boutique : −${n} ${p.name} (reste ${p.bou})`); afterMove(p,`−${n} ${p.name}`);
}
function loadTruck(p,n){                // déplacer du dépôt vers le camion (le total boutique ne change pas)
  const dispo=p.bou-p.cam; n=Math.min(n,dispo); if(n<=0) return toast("Rien à charger : tout est déjà dans le camion");
  p.cam+=n; log(`Chargé ${n} ${p.name} dans le camion`); save();render(); toast(`${n} chargé${n>1?"s":""} dans le camion`);
}
function unloadTruck(p,n){
  n=Math.min(n,p.cam); if(n<=0) return; p.cam-=n; log(`Déchargé ${n} ${p.name} au dépôt`); save();render(); toast(`${n} remis au dépôt`);
}
function receive(p,n){
  if(n<=0) return; p.bou+=n; log(`Réception : +${n} ${p.name} (boutique ${p.bou})`); save();render(); toast(`+${n} ${p.name}`);
}

/* --- Boîte quantité --- */
let qAct=null;
function askQty(title,subtitle,def,fn){
  $("#qT").textContent=title; $("#qS").textContent=subtitle; $("#qN").value=def; qAct=fn;
  $("#qdlg").showModal(); setTimeout(()=>$("#qN").select(),50);
}
$("#qOk").onclick=()=>{const n=parseInt($("#qN").value,10)||0; const f=qAct; qAct=null; $("#qdlg").close(); if(f&&n>0) f(n); else if(n<=0) toast("Mets une quantité d'au moins 1")};
$("#qMinus").onclick=()=>{$("#qN").value=Math.max(1,(parseInt($("#qN").value,10)||1)-1)};
$("#qPlus").onclick=()=>{$("#qN").value=(parseInt($("#qN").value,10)||0)+1};
$("#qCancel").onclick=()=>$("#qdlg").close();

/* --- Fiche pièce --- */
let editId=null;
function openEdit(p){
  editId=p?p.id:null;
  $("#dlgT").textContent=p?"Modifier la pièce":"Nouvelle pièce";
  $("#fName").value=p?p.name:""; $("#fRef").value=p?p.ref:""; $("#fCat").value=p?p.cat:(cat||"");
  $("#fBou").value=p?p.bou:DEPART; $("#fCam").value=p?p.cam:0;
  $("#fSeuil").value=p?p.seuil:SEUIL; $("#fCmd").value=p?p.cmd:DEPART-SEUIL; $("#fUrl").value=p?p.url:"";
  $("#fDel").hidden=!p;
  $("#cats").innerHTML=[...new Set(S.items.map(x=>x.cat).filter(Boolean))].map(c=>`<option value="${esc(c)}">`).join("");
  $("#dlg").showModal();
}
$("#fOk").addEventListener("click",()=>{
  const name=$("#fName").value.trim(); if(!name){toast("Donne un nom à la pièce");$("#fName").focus();return}
  const num=(id,d)=>{const v=parseInt($(id).value,10);return isNaN(v)||v<0?d:v};
  const d={name,ref:$("#fRef").value.trim(),cat:$("#fCat").value.trim(),bou:num("#fBou",DEPART),seuil:num("#fSeuil",SEUIL),cmd:Math.max(1,num("#fCmd",DEPART-SEUIL)),url:$("#fUrl").value.trim()};
  d.cam=Math.min(num("#fCam",0),d.bou);
  if(d.url&&!/^https?:\/\//i.test(d.url)) d.url="https://"+d.url;
  if(editId){Object.assign(byId(editId),d); log(`Fiche modifiée : ${name}`)}
  else{S.items.push({id:uid(),...d}); log(`Nouvelle pièce : ${name} (${d.bou})`)}
  $("#dlg").close(); save();render(); toast("Pièce enregistrée");
});
$("#fCancel").onclick=()=>$("#dlg").close();
$("#fDel").onclick=()=>{
  const p=byId(editId); if(!p) return; $("#dlg").close(); ask(`Supprimer « ${p.name} » ?`,()=>{S.items=S.items.filter(x=>x!==p);log(`Pièce supprimée : ${p.name}`);save();render()})
};

/* --- Clics --- */
$("#nav").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;view=b.dataset.v;q="";cat="";camMode="in";render();scrollTo(0,0)});
$("#alert").onclick=()=>{view="commande";render();scrollTo(0,0)};
$("#view").addEventListener("input",e=>{if(e.target.id==="q"){q=e.target.value;const pos=e.target.selectionStart;render();const i=$("#q");i.focus();i.setSelectionRange(pos,pos)}});
$("#view").addEventListener("click",e=>{
  const c=e.target.closest(".chips button"); if(c){cat=c.dataset.c;render();return}
  const m=e.target.closest(".seg button"); if(m){camMode=m.dataset.m;render();return}
  const b=e.target.closest("button"); if(!b) return;
  if(b.id==="add") return openEdit(null);
  if(b.id==="share") return shareList();
  if(b.id==="exp") return exportData();
  if(b.id==="imp") return importData();
  if(b.id==="reset"){ ask("Tout remettre à zéro (10 pièces par référence) ?",()=>{try{localStorage.removeItem(KEY)}catch(e){}S=null;load();render();toast("Stock réinitialisé")}); return }
  if(b.id==="loadAll"){ let n=0; S.items.forEach(p=>{if(p.cam===0){const k=Math.min(2,p.bou);if(k>0){p.cam=k;n+=k}}}); log(`Chargement camion : ${n} pièces`); save();render(); toast(`${n} pièces chargées`); return }
  const card=b.closest("[data-id]"); if(!card) return; const p=byId(card.dataset.id); if(!p) return;
  switch(b.dataset.a){
    case "take": return takeFromTruck(p,1);
    case "takeN": return askQty("Prendre dans le camion",p.name+` — ${p.cam} dans le camion`,1,n=>takeFromTruck(p,n));
    case "unload": return askQty("Remettre au dépôt",p.name,p.cam,n=>unloadTruck(p,n));
    case "use": return useFromShop(p,1);
    case "load1": return loadTruck(p,1);
    case "load": return askQty("Charger dans le camion",p.name+` — ${p.bou-p.cam} dispo au dépôt`,Math.min(2,Math.max(1,p.bou-p.cam)),n=>loadTruck(p,n));
    case "recv": return askQty("Réception de commande",p.name+` — stock actuel ${p.bou}`,p.cmd,n=>receive(p,n));
    case "edit": return openEdit(p);
  }
});

function shareList(){
  const low=S.items.filter(isLow);
  const txt="Commande plomberie :\n"+low.map(p=>`- ${p.cmd} × ${p.name}${p.ref?" ("+p.ref+")":""}${p.url?" : "+p.url:""}`).join("\n");
  showText("Liste de commande","Copie-la puis colle-la dans un SMS ou un mail à ton fournisseur.",txt);
}
function exportData(){
  showText("Sauvegarde","Copie ce texte et garde-le dans tes notes ou un mail. Pour restaurer : Importer, puis choisis un fichier .json contenant ce texte.",JSON.stringify(S));
}
function importData(){
  const i=document.createElement("input"); i.type="file"; i.accept="application/json,.json";
  i.onchange=()=>{const f=i.files[0]; if(!f) return; f.text().then(t=>{const d=JSON.parse(t); if(!Array.isArray(d.items)) throw 0; S={items:d.items,log:d.log||[]}; save(); render(); toast("Stock importé")}).catch(()=>toast("Fichier invalide : ce n'est pas une sauvegarde du stock"))};
  i.click();
}

load(); render();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body></html>
